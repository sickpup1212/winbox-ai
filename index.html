function openFormModal({ id, title, width='420px', height='280px', fields=[], submitLabel='Submit', onSubmit }) {
  const fieldHtml = fields.map(f => `
    <label>${escHtml(f.label)}</label>
    ${f.type === 'textarea'
      ? `<textarea id="ff-${f.name}" placeholder="${escHtml(f.placeholder||'')}" style="min-height:90px"></textarea>`
      : `<input type="${f.type||'text'}" id="ff-${f.name}" placeholder="${escHtml(f.placeholder||'')}" />`
    }`).join('');

  const footer = `
    <button class="btn-primary" onclick="submitForm_${id.replace(/\W/g,'_')}()">${escHtml(submitLabel)}</button>
    <button class="btn-secondary" onclick="openModals.get('${id}')?.close()">Cancel</button>`;

  openModal({ id, title, width, height, content: fieldHtml, footer });

  // Attach submit fn on window (simplest approach for inline onclick)
  window[`submitForm_${id.replace(/\W/g,'_')}`] = () => {
    const values = {};
    fields.forEach(f => {
      const el = document.getElementById(`ff-${f.name}`);
      if (el) values[f.name] = el.value;
    });
    openModals.get(id)?.close();
    onSubmit(values);
    delete window[`submitForm_${id.replace(/\W/g,'_')}`];
  };
}

function confirmModal(message, confirmLabel = 'Confirm') {
  return new Promise(resolve => {
    const id = `confirm-${Date.now()}`;
    const content = `<div class="confirm-msg">${message}</div>`;
    const footer  = `
      <button class="btn-danger"      onclick="resolveConfirm_${id.replace(/\W/g,'_')}(true)">${escHtml(confirmLabel)}</button>
      <button class="btn-secondary"   onclick="resolveConfirm_${id.replace(/\W/g,'_')}(false)">Cancel</button>`;
    openModal({ id, title: '⚠ Confirm', width:'380px', height:'180px', content, footer,
      onclose() {
        // Resolve false if the dialog is dismissed via the WinBox ✕ button,
        // so the awaiting tool-call loop never hangs.
        openModals.delete(id);
        resolve(false);
        delete window[`resolveConfirm_${id.replace(/\W/g,'_')}`];
      }
    });
    window[`resolveConfirm_${id.replace(/\W/g,'_')}`] = (val) => {
      resolve(val);                 // resolve first so the ✕ onclose can't override
      openModals.get(id)?.close();
      delete window[`resolveConfirm_${id.replace(/\W/g,'_')}`];
    };
  });
}

async function openModelPicker() {
  const id = 'model-picker';
  if (openModals.has(id)) { openModals.get(id).focus(); return; }

  const root = document.createElement('div');
  root.className = 'modal-root mp-wrap';
  root.innerHTML = `
    <div class="mp-controls">
      <input type="search" id="mp-search" placeholder="Search by name or provider…" autocomplete="off">
      <select id="mp-cap">
        <option value="">All capabilities</option>
        <option value="image">Vision (image in)</option>
        <option value="audio">Audio in</option>
        <option value="file">File in</option>
      </select>
      <select id="mp-sort">
        <option value="name">Sort: Name A–Z</option>
        <option value="price_in">Sort: Price In ↑</option>
        <option value="price_out">Sort: Price Out ↑</option>
        <option value="context">Sort: Context ↓</option>
      </select>
    </div>
    <div class="mp-table-wrap">
      <div id="mp-loading" style="padding:30px;text-align:center;color:#666;font-size:13px">Loading models…</div>
      <table class="mp-table" id="mp-table" style="display:none">
        <thead><tr>
          <th>Model</th>
          <th>Input</th>
          <th>Output</th>
          <th style="text-align:right">Context</th>
          <th style="text-align:right">In&nbsp;$/M</th>
          <th style="text-align:right">Out&nbsp;$/M</th>
        </tr></thead>
        <tbody id="mp-body"></tbody>
      </table>
    </div>
    <div class="mp-footer">
      <span id="mp-count" class="mp-count">—</span>
      <button class="btn-primary" id="mp-use">Use Selected</button>
    </div>`;

  const off = (modalOffset % 5) * 24;
  modalOffset++;
  const wb = new WinBox({
    title: '⊞ Model Browser',
    width: '820px', height: '540px',
    x: `calc(50% - ${410 - off}px)`,
    y: `calc(50% - ${270 - off}px)`,
    background: '#4a4580', border: 2,
    mount: root,
    onclose() { openModals.delete(id); },
  });
  openModals.set(id, wb);

  let allModels = [];
  let selected  = null;
  const currentModel = chatDoc.modelSel.value;

  function fmtPrice(perToken) {
    const n = parseFloat(perToken || 0) * 1_000_000;
    if (n === 0)   return `<span class="mp-price-free">free</span>`;
    if (n < 0.1)   return `<span class="mp-price-cheap">$${n.toFixed(4)}</span>`;
    if (n < 5)     return `<span class="mp-price-mid">$${n.toFixed(3)}</span>`;
    return             `<span class="mp-price-exp">$${n.toFixed(2)}</span>`;
  }

  function fmtCtx(n) {
    if (!n) return '—';
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1_000)     return Math.round(n / 1_000) + 'K';
    return String(n);
  }

  function badges(mods) {
    const cfg = { text: ['mp-badge-text','T'], image: ['mp-badge-image','I'],
                  audio: ['mp-badge-audio','A'], file: ['mp-badge-file','F'] };
    return (mods || []).map(m => {
      const [cls, lbl] = cfg[m] || ['mp-badge-text', m[0].toUpperCase()];
      return `<span class="mp-badge ${cls}" title="${m}">${lbl}</span>`;
    }).join('');
  }

  function filtered() {
    const q   = document.getElementById('mp-search')?.value.toLowerCase() || '';
    const cap = document.getElementById('mp-cap')?.value || '';
    const srt = document.getElementById('mp-sort')?.value || 'name';

    let list = allModels.filter(m => {
      if (q && !m.id.toLowerCase().includes(q) && !(m.name||'').toLowerCase().includes(q)) return false;
      if (cap && !(m.architecture?.input_modalities || []).includes(cap)) return false;
      return true;
    });

    list.sort((a, b) => {
      if (srt === 'name')      return (a.name||'').localeCompare(b.name||'');
      if (srt === 'price_in')  return parseFloat(a.pricing?.prompt||0) - parseFloat(b.pricing?.prompt||0);
      if (srt === 'price_out') return parseFloat(a.pricing?.completion||0) - parseFloat(b.pricing?.completion||0);
      if (srt === 'context')   return (b.context_length||0) - (a.context_length||0);
      return 0;
    });
    return list;
  }

  function renderTable() {
    const tbody = document.getElementById('mp-body');
    const count = document.getElementById('mp-count');
    if (!tbody || !count) return;

    const list = filtered();
    count.textContent = `${list.length} model${list.length !== 1 ? 's' : ''}`;

    const visible = list.slice(0, 150);
    tbody.innerHTML = visible.map(m => {
      const isSel   = selected ? selected === m.id : m.id === currentModel;
      const inMods  = m.architecture?.input_modalities  || ['text'];
      const outMods = m.architecture?.output_modalities || ['text'];
      return `<tr class="mp-row${isSel ? ' mp-row-selected' : ''}" data-id="${escHtml(m.id)}">
        <td class="mp-col-name">
          <div class="mp-model-name" title="${escHtml(m.name)}">${escHtml(m.name)}</div>
          <div class="mp-model-id">${escHtml(m.id)}</div>
        </td>
        <td>${badges(inMods)}</td>
        <td>${badges(outMods)}</td>
        <td class="mp-col-num">${fmtCtx(m.context_length)}</td>
        <td class="mp-col-num">${fmtPrice(m.pricing?.prompt)}</td>
        <td class="mp-col-num">${fmtPrice(m.pricing?.completion)}</td>
      </tr>`;
    }).join('');

    if (list.length > 150) {
      tbody.insertAdjacentHTML('beforeend',
        `<tr><td colspan="6" style="text-align:center;color:#555;padding:8px;font-size:11px">
          Showing 150 of ${list.length} — use search or filters to narrow results
        </td></tr>`);
    }

    tbody.querySelectorAll('.mp-row').forEach(row => {
      row.addEventListener('click', () => {
        tbody.querySelectorAll('.mp-row').forEach(r => r.classList.remove('mp-row-selected'));
        row.classList.add('mp-row-selected');
        selected = row.dataset.id;
      });
      row.addEventListener('dblclick', () => {
        selected = row.dataset.id;
        applySelection();
      });
    });
  }

  function applySelection() {
    if (!selected) return;
    const model = allModels.find(m => m.id === selected);
    if (!model) return;

    const sel = chatDoc.modelSel;
    if (!Array.from(sel.options).find(o => o.value === selected)) {
      let cg = Array.from(sel.querySelectorAll('optgroup')).find(g => g.label === 'Custom');
      if (!cg) { cg = document.createElement('optgroup'); cg.label = 'Custom'; sel.appendChild(cg); }
      const opt = document.createElement('option');
      opt.value = selected; opt.text = model.name;
      cg.appendChild(opt);
    }
    sel.value = selected;
    wb.close();
    addSystemMsg(`Model set to <strong>${escHtml(model.name)}</strong>`);
  }

  root.querySelector('#mp-use').addEventListener('click', applySelection);
  ['mp-search','mp-cap','mp-sort'].forEach(eid =>
    root.querySelector(`#${eid}`)?.addEventListener('input', renderTable)
  );

  try {
    const key = chatDoc.apiKey.value.trim();
        const params = new URLSearchParams();
        if (key) params.set('key', key);
        params.set('base_url', normBaseUrl(getApiBaseUrl()));
        const url  = '/api/models?' + params.toString();
        const data = await fetch(url).then(r => r.json());
    allModels  = (data.data || []).filter(m => m.id && m.name);

    root.querySelector('#mp-loading').style.display = 'none';
    root.querySelector('#mp-table').style.display   = '';
    renderTable();
  } catch (e) {
    root.querySelector('#mp-loading').textContent = `❌ Failed to load models: ${e.message}`;
  }
}

/* ══════════════════════════════════════════════════════
   TEXT / CODE EDITOR
══════════════════════════════════════════════════════ */
let editorCount = 0;

const EXT_LANG = { js:'javascript', mjs:'javascript', cjs:'javascript', ts:'typescript', tsx:'typescript', jsx:'javascript', py:'python', html:'html', htm:'html', css:'css', json:'json', jsonl:'json', sql:'sql', sh:'bash', bash:'bash', md:'markdown', markdown:'markdown', yaml:'yaml', yml:'yaml', xml:'xml', txt:'plain', csv:'plain', env:'plain' };

const LANGS = ['plain','javascript','typescript','python','html','css','json','sql','bash','markdown','yaml','xml'];

function openEditorWindow({ filename = 'untitled.txt', content = '', language = '', fileRef = null } = {}) {
  editorCount++;
  const eid = `ed-${editorCount}`;

  if (!language) {
    const ext = filename.split('.').pop().toLowerCase();
    language = EXT_LANG[ext] || 'plain';
  }

  const root = document.createElement('div');
  root.className = 'ed-root';
  root.innerHTML = `
    <div class="ed-toolbar">
      <input class="ed-filename" type="text" value="${escHtml(filename)}" placeholder="filename…" spellcheck="false" />
      <select class="ed-lang">
        ${LANGS.map(l => `<option value="${l}"${l === language ? ' selected' : ''}>${l}</option>`).join('')}
      </select>
      <button class="ed-tbtn" id="${eid}-wrap" title="Toggle word wrap">↵ Wrap</button>
      <button class="ed-tbtn" id="${eid}-copy">📋 Copy</button>
      <button class="ed-tbtn" id="${eid}-dl">⬇ Save</button>
      <button class="ed-tbtn" id="${eid}-new" title="Open a new blank editor">＋ New</button>
      <button class="ed-tbtn ed-tbtn-db" id="${eid}-dbsave" style="display:none" title="Save content back to the file store">💾 DB Save</button>
    </div>
    <div class="ed-wrap">
      <div class="ed-lines" id="${eid}-lines">1</div>
      <textarea class="ed-textarea" id="${eid}-ta"
        spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
      ></textarea>
    </div>
    <div class="ed-statusbar">
      <span class="ed-sl" id="${eid}-pos">Ln 1, Col 1</span>
      <span class="ed-sl" id="${eid}-chars">0 chars</span>
      <span class="ed-sl" id="${eid}-lang"></span>
    </div>`;

  const ta      = root.querySelector(`#${eid}-ta`);
  const linesEl = root.querySelector(`#${eid}-lines`);
  const posEl   = root.querySelector(`#${eid}-pos`);
  const charEl  = root.querySelector(`#${eid}-chars`);
  const langLbl = root.querySelector(`#${eid}-lang`);
  const langSel = root.querySelector('.ed-lang');
  const fileEl  = root.querySelector('.ed-filename');

  // Set content safely (no innerHTML)
  ta.value = content;

  let wordWrap = false;

  function updateLines() {
    const count = ta.value.split('\n').length;
    linesEl.textContent = Array.from({ length: count }, (_, i) => i + 1).join('\n');
    linesEl.scrollTop = ta.scrollTop;
  }

  function updateStatus() {
    const val   = ta.value;
    const lines = val.slice(0, ta.selectionStart).split('\n');
    posEl.textContent  = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
    charEl.textContent = `${val.length.toLocaleString()} chars · ${val.split('\n').length} lines`;
    langLbl.textContent = langSel.value;
  }

  function refresh() { updateLines(); updateStatus(); }

  ta.addEventListener('input',  refresh);
  ta.addEventListener('click',  updateStatus);
  ta.addEventListener('keyup',  updateStatus);
  ta.addEventListener('scroll', () => { linesEl.scrollTop = ta.scrollTop; });
  langSel.addEventListener('change', updateStatus);

  // Tab → spaces, Enter → auto-indent
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, end = ta.selectionEnd;
      if (s === end) {
        ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(end);
        ta.selectionStart = ta.selectionEnd = s + 2;
      } else {
        // indent selected lines
        const lines = ta.value.split('\n');
        let charCount = 0, startLine = 0, endLine = 0;
        for (let i = 0; i < lines.length; i++) {
          if (charCount <= s) startLine = i;
          if (charCount <= end) endLine = i;
          charCount += lines[i].length + 1;
        }
        for (let i = startLine; i <= endLine; i++) lines[i] = '  ' + lines[i];
        ta.value = lines.join('\n');
      }
      refresh();
    }
    if (e.key === 'Enter' && !e.ctrlKey) {
      const s         = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
      const indent    = ta.value.slice(lineStart).match(/^[ \t]*/)[0];
      if (indent) {
        e.preventDefault();
        ta.value = ta.value.slice(0, s) + '\n' + indent + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 1 + indent.length;
        refresh();
      }
    }
  });

  // Word-wrap toggle
  root.querySelector(`#${eid}-wrap`).addEventListener('click', function () {
    wordWrap = !wordWrap;
    ta.style.whiteSpace = wordWrap ? 'pre-wrap' : 'pre';
    ta.style.wordBreak  = wordWrap ? 'break-all' : 'normal';
    this.style.color    = wordWrap ? '#a89fff' : '';
    this.style.borderColor = wordWrap ? '#6c63ff' : '';
  });

  // Copy
  root.querySelector(`#${eid}-copy`).addEventListener('click', function () {
    navigator.clipboard.writeText(ta.value).catch(() => {});
    const prev = this.textContent;
    this.textContent = '✓ Copied!';
    setTimeout(() => this.textContent = prev, 1600);
  });

  // Download / save to disk
  root.querySelector(`#${eid}-dl`).addEventListener('click', () => {
    const blob = new Blob([ta.value], { type: 'text/plain;charset=utf-8' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = fileEl.value.trim() || 'untitled.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // New blank editor
  root.querySelector(`#${eid}-new`).addEventListener('click', () => openEditorWindow());

  // Keep WinBox title in sync with filename
  fileEl.addEventListener('input', () => wb.setTitle('📝 ' + (fileEl.value.trim() || 'untitled')));

  // DB Save — only shown when editor is linked to a stored file
  if (fileRef) {
    const dbBtn = root.querySelector(`#${eid}-dbsave`);
    dbBtn.style.display = '';
    let dirty = false;

    ta.addEventListener('input', () => {
      if (!dirty) {
        dirty = true;
        dbBtn.classList.add('dirty');
        dbBtn.textContent = '💾 DB Save*';
      }
    });

    dbBtn.addEventListener('click', async () => {
      dbBtn.textContent = '…'; dbBtn.disabled = true;
      try {
        const res = await fetch(`/api/files/${fileRef.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: ta.value, language: langSel.value }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        dirty = false;
        dbBtn.classList.remove('dirty'); dbBtn.classList.add('saved');
        dbBtn.textContent = '✓ Saved';
        setTimeout(() => { dbBtn.classList.remove('saved'); dbBtn.textContent = '💾 DB Save'; }, 2000);
      } catch (e) {
        dbBtn.textContent = '✗ Failed';
        setTimeout(() => { dbBtn.textContent = '💾 DB Save*'; }, 2000);
      } finally {
        dbBtn.disabled = false;
      }
    });
  }

  // Initial render
  refresh();

  const off = (modalOffset % 8) * 20; modalOffset++;
  const wb  = new WinBox({
    title:  `📝 ${filename}`,
    width:  '680px',
    height: '520px',
    x: `calc(50% - ${340 - off}px)`,
    y: `calc(50% - ${260 - off}px)`,
    background: '#1e3a2f',
    border: 2,
    mount: root,
    onclose() { openModals.delete(eid); },
  });
  openModals.set(eid, wb);

  // Focus textarea after WinBox finishes mounting
  setTimeout(() => { ta.focus(); ta.setSelectionRange(0, 0); }, 60);
  return wb;
}

/* ══════════════════════════════════════════════════════
   FILE EXPLORER
══════════════════════════════════════════════════════ */
async function openFileExplorer() {
  const id = 'file-explorer';
  if (openModals.has(id)) { openModals.get(id).focus(); return; }

  const root = document.createElement('div');
  root.className = 'fe-root';
  root.innerHTML = `
    <div class="fe-toolbar">
      <button class="fe-tbtn" id="fe-new">📄 New File</button>
      <button class="fe-tbtn" id="fe-refresh" title="Refresh">↺</button>
      <input  class="fe-search" id="fe-search" type="search" placeholder="Filter files…" autocomplete="off" />
    </div>
    <div class="fe-body">
      <div class="fe-tree"   id="fe-tree"><div class="fe-empty">Loading…</div></div>
      <div class="fe-detail" id="fe-detail"><div class="fe-empty">Select a file</div></div>
    </div>
    <div class="fe-statusbar" id="fe-status">—</div>`;

  let allFiles = [];
  let selectedFile = null;

  const FILE_ICONS = { js:'🟨', mjs:'🟨', ts:'🔷', tsx:'🔷', jsx:'🟨', py:'🐍', html:'🌐', htm:'🌐', css:'🎨', json:'📋', jsonl:'📋', md:'📝', sql:'🗄', sh:'⚙', bash:'⚙', yaml:'⚙', yml:'⚙', xml:'📄', csv:'📊', txt:'📄', env:'🔑' };
  const icon = name => FILE_ICONS[name.split('.').pop().toLowerCase()] || '📄';

  const fmtBytes = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n/1024).toFixed(1)} KB` : `${(n/1048576).toFixed(1)} MB`;
  const fmtDate  = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); };

  async function loadFiles() {
    try {
      const r = await fetch('/api/files');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      allFiles = await r.json();
    } catch (e) {
      root.querySelector('#fe-tree').innerHTML = `<div class="fe-empty" style="color:#ff6b6b">Error: ${escHtml(e.message)}</div>`;
      return;
    }
    renderTree();
  }

  function renderTree() {
    const q       = root.querySelector('#fe-search').value.toLowerCase();
    const treeEl  = root.querySelector('#fe-tree');
    const statusEl = root.querySelector('#fe-status');

    const shown = q ? allFiles.filter(f => f.name.toLowerCase().includes(q) || f.folder.toLowerCase().includes(q)) : allFiles;

    if (!shown.length) {
      treeEl.innerHTML = `<div class="fe-empty">${q ? 'No matches.' : 'No files yet.\nClick 📄 New File to start.'}</div>`;

/* ══════════════════════════════════════════════════════
   FILE UPLOAD
══════════════════════════════════════════════════════ */
async function handleFileSelection() {
  const files = Array.from(chatDoc.fileInput.files);
  chatDoc.fileInput.value = '';           // allow re-selecting same file
  for (const file of files) {
    const isImage = file.type.startsWith('image/');
    try {
      const data = await readFileAsDataOrText(file, isImage);
      pendingAttachments.push({ name: file.name, type: file.type, data, isImage });
    } catch (e) {
      addSystemMsg(`⚠ Could not read <strong>${escHtml(file.name)}</strong>: ${escHtml(e.message)}`);
    }
  }
  updateFilePreview();
}

function readFileAsDataOrText(file, asBase64) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    if (asBase64) {
      reader.onload = () => resolve(reader.result);   // data: URL
      reader.readAsDataURL(file);
    } else {
      reader.onload = () => resolve(reader.result);
      reader.readAsText(file);
    }
  });
}

function updateFilePreview() {
  const fp = chatDoc.filePreview;
  if (!fp) return;
  fp.innerHTML = '';
  if (!pendingAttachments.length) {
    fp.classList.remove('visible');
    chatDoc.uploadBtn.classList.remove('has-files');
    return;
  }
  fp.classList.add('visible');
  chatDoc.uploadBtn.classList.add('has-files');
  pendingAttachments.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `<span class="file-chip-name" title="${escHtml(a.name)}">${a.isImage ? '🖼' : '📄'} ${escHtml(a.name)}</span><span class="file-chip-x" data-idx="${i}">✕</span>`;
    chip.querySelector('.file-chip-x').addEventListener('click', () => {
      pendingAttachments.splice(i, 1);
      updateFilePreview();
    });
    fp.appendChild(chip);
  });
}

══════════════════════════════════════════════════════ */
function getConversations() {
  try { return JSON.parse(localStorage.getItem('winboxai_conversations') || '[]'); } catch { return []; }
}
function saveConversations(list) { localStorage.setItem('winboxai_conversations', JSON.stringify(list)); }

function saveConversationAs(name) {
  if (!name) return;
  const list = getConversations();
  const entry = {
    name,
    savedAt: new Date().toISOString(),
    history: JSON.parse(JSON.stringify(history)),
    tokens: totalTokens,
  };
  const idx = list.findIndex(c => c.name === name);
  if (idx >= 0) list[idx] = entry; else list.unshift(entry);
  saveConversations(list);
  return entry;
}

function openConversationsModal() {
  const id = 'conversations';
  if (openModals.has(id)) { openModals.get(id).focus(); return; }

  const root = document.createElement('div');
  root.className = 'cv-root';

    <div class="cv-save-bar">

  const listEl = root.querySelector('#cv-list');
  const nameEl = root.querySelector('#cv-name');

  function fmt(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' +
           d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  }

  function msgCount(h) { return h.filter(m => m.role === 'user' || m.role === 'assistant').length; }

  function renderList() {
    const convos = getConversations();
    if (!convos.length) {
      listEl.innerHTML = '<div class="cv-empty">No saved conversations yet.<br>Type a name above and click <strong>Save Current</strong>.</div>';
      return;
    }
    listEl.innerHTML = convos.map((c, i) => `
      <div class="cv-item" data-idx="${i}">
        <div class="cv-item-info">
          <div class="cv-item-name" title="${escHtml(c.name)}">${escHtml(c.name)}</div>
          <div class="cv-item-meta">${msgCount(c.history)} messages · ${fmt(c.savedAt)} · ${(c.tokens||0).toLocaleString()} tokens</div>

        <button class="cv-btn-load" data-idx="${i}">↩ Load</button>
        <button class="cv-btn-del"  data-idx="${i}">🗑</button>
      </div>`).join('');

    listEl.querySelectorAll('.cv-btn-load').forEach(btn =>
      btn.addEventListener('click', () => {
        const c = getConversations()[+btn.dataset.idx];
        if (!c) return;
        history = JSON.parse(JSON.stringify(c.history));
        totalTokens = c.tokens || 0;
        chatDoc.statusBar.textContent = `tokens: ${totalTokens.toLocaleString()}`;
        chatDoc.messages.innerHTML = '';
        history.forEach(m => {
                  if (m.role === 'user') {
                    if (Array.isArray(m.content)) {
                      const html = m.content.map(p => {
                        if (p.type === 'image_url') return `<img class="chat-img" src="${p.image_url.url}" alt="attached image" />`;
                        return escHtml(p.text || '').replace(/\n/g,'<br>');
                      }).join(' ');
                      addBubble('user', html);
                    } else {
                      addBubble('user', escHtml(m.content).replace(/\n/g,'<br>'));
                    }
          } else if (m.role === 'assistant' && m.content) {
            addBubble('assistant', renderMarkdown(m.content));
          }
        });
        openModals.get(id)?.close();
        addSystemMsg(`💬 Loaded "<strong>${escHtml(c.name)}</strong>".`);
      })
    );

    listEl.querySelectorAll('.cv-btn-del').forEach(btn =>
      btn.addEventListener('click', () => {
        const list = getConversations();
        const c = list[+btn.dataset.idx];
        if (!c || !confirm(`Delete "${c.name}"?`)) return;
        list.splice(+btn.dataset.idx, 1);
        saveConversations(list);
        renderList();
      })
    );
  }

  renderList();

  root.querySelector('#cv-save').addEventListener('click', () => {
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }
    if (!history.length) { addSystemMsg('⚠ Nothing to save — conversation is empty.'); return; }
    saveConversationAs(name);
    renderList();
    addSystemMsg(`💾 Conversation saved as "<strong>${escHtml(name)}</strong>".`);
    nameEl.value = '';
  });

  // Pre-fill name if chat has a prior saved name
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') root.querySelector('#cv-save').click(); });

  const off = (modalOffset % 5) * 24; modalOffset++;
  const wb = new WinBox({
    title: '💬 Conversations', width: '520px', height: '440px',
    x: `calc(50% - ${260 - off}px)`, y: `calc(50% - ${220 - off}px)`,
    background: '#4a4580', border: 2, mount: root,
    onclose() { openModals.delete(id); },
  });
  openModals.set(id, wb);
}

/* ══════════════════════════════════════════════════════
   TOOLS ENGINE — localStorage helpers
══════════════════════════════════════════════════════ */
// Custom tools are DB-backed (shared across browsers). We keep an in-memory cache
// so existing synchronous call sites keep working; saveCustomTools syncs to the DB.
let customToolsCache = [];

async function loadCustomTools() {
  try {
    const r = await fetch('/api/custom-tools');
    if (!r.ok) { customToolsCache = []; return; }
    customToolsCache = await r.json();
  } catch { customToolsCache = []; }
}

function getCustomTools() { return customToolsCache; }

// Update the cache immediately, then persist to the DB (fire-and-forget).
function saveCustomTools(list) {
  customToolsCache = list;
  syncCustomTools(list);
}

async function syncCustomTools(list) {
  try {
    const existing = await (await fetch('/api/custom-tools')).json();
    const names = new Set(list.map(t => t.name));
    // Upsert each tool in the new list
    for (const t of list) {
      const ex = existing.find(e => e.name === t.name);
      const payload = { name: t.name, description: t.description || '', parameters: t.parameters || {}, body: t.body || '', language: t.language || 'python' };
      if (ex) {
        await fetch(`/api/custom-tools/${ex.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      } else {
        await fetch('/api/custom-tools', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      }
    }
    // Delete tools that were removed from the list
    for (const ex of existing) {
      if (!names.has(ex.name)) {
        await fetch(`/api/custom-tools/${ex.id}`, { method: 'DELETE' });
      }
    }
  } catch (e) {
    console.error('Failed to sync custom tools to DB:', e);
  }
}

function buildCustomToolDefs() {
  return getCustomTools().map(t => ({
    type: 'function',
    function: {
      name: t.name,
      description: t.description || '',
      parameters: { type: 'object', properties: t.parameters || {}, required: [] },
    },
  }));
}

    if (!s) return;
    if (!confirm(`Delete skill "${s.name}"?`)) return;
    await fetch(`/api/skills/${s.id}`, { method: 'DELETE' });
    await refreshList();
    populate(null);
    setOut('&gt; Skill deleted.', '#f4a261');
    await loadSkillsMeta();
  });

  root.querySelector('#sk-save').addEventListener('click', async () => {
    const name = nameEl.value.trim();
    if (!name) { setOut('&gt; Name is required.', '#ff6b6b'); return; }
    if (!/^[a-z][a-z0-9-]*$/.test(name)) { setOut('&gt; Name must be lowercase letters, numbers, hyphens.', '#ff6b6b'); return; }
    let resources = [];
    const raw = resEl.value.trim();
    if (raw) {
      try { resources = JSON.parse(raw); }
      catch { setOut('&gt; Resources must be valid JSON.', '#ff6b6b'); return; }
    }
    const payload = { name, description: descEl.value, instructions: instrEl.value, resources };
    const skills = await refreshList();
    const existing = skills.find(s => s.name === name);
    let res;
    if (existing) {
      res = await fetch(`/api/skills/${existing.id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } else {
      res = await fetch('/api/skills', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    }
    if (!res.ok) { setOut('&gt; Save failed: ' + escHtml((await res.json()).error || res.status), '#ff6b6b'); return; }
    await refreshList();
    setOut('&gt; Skill "' + escHtml(name) + '" saved.', '#23c7a8');
    await loadSkillsMeta();
  });

  const off = (modalOffset % 5) * 24; modalOffset++;
  const wb = new WinBox({
    title: '🧠 Skills', width: '720px', height: '560px',
    x: `calc(50% - ${360 - off}px)`, y: `calc(50% - ${280 - off}px)`,
    background: '#4a4580', border: 2, mount: root,
    onclose() { openModals.delete(id); },
  });
  openModals.set(id, wb);
  refreshList();
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════════════
   CHARACTER CARDS (roleplay profiles)
══════════════════════════════════════════════════════ */
// Currently active character (its full card), or null for no character.
let activeCharacter = null;

function buildLorebookBlock(book, contextText) {
  if (!book || !Array.isArray(book.entries) || !book.entries.length) return '';
  const entries = book.entries.filter(e => e && e.enabled !== false && e.content);
  if (!entries.length) return '';
  const ctx = (contextText || '').toLowerCase();
  // Key-based activation: include an entry if any of its keys appear in context.
  let active = entries.filter(e => {
    const keys = (e.keys || []).concat(e.secondary_keys || []);
    if (!keys.length) return true; // no keys -> always include
    return keys.some(k => k && ctx.includes(String(k).toLowerCase()));
  });
  // If nothing matched, fall back to all enabled entries so the lore isn't lost.
  if (!active.length) active = entries;
  const lines = active.map(e => e.content).filter(Boolean);
  if (!lines.length) return '';
  return '\n\nWorld lore (use this to inform your responses when relevant):\n' + lines.join('\n---\n');
}

function buildCharacterSystemPrompt(c, contextText) {
  const parts = [];
  parts.push(`You are now playing the role of ${c.name || 'this character'} in a roleplay. Stay fully in character and respond as ${c.name || 'this character'} would. Do not break character or mention that you are an AI unless the user explicitly asks.`);
  if (c.description) parts.push(`\nCharacter description:\n${c.description}`);
  if (c.personality) parts.push(`\nPersonality:\n${c.personality}`);
  if (c.scenario)    parts.push(`\nScenario:\n${c.scenario}`);
  if (c.mes_example) parts.push(`\nExample dialogue (format reference):\n${c.mes_example}`);
  if (c.system_prompt) parts.push(`\nSystem instructions:\n${c.system_prompt}`);
  if (c.post_history)  parts.push(`\nPost-history instructions:\n${c.post_history}`);
  const lore = buildLorebookBlock(c.character_book, contextText);
  if (lore) parts.push(lore);
  return parts.join('\n');
}

    postEl.value   = c.post_history || '';
    loreEl.value   = (c.character_book && Object.keys(c.character_book).length) ? JSON.stringify(c.character_book, null, 2) : '';
    tagsEl.value   = (c.tags || []).join(', ');
    setAvatar(c.avatar || '');
    setOut('&gt; Loaded "' + escHtml(c.name) + '".');
  }

  listEl.addEventListener('change', async () => {
    const idx = parseInt(listEl.value);
    const chars = await refreshList();
    const c = chars[idx];
    if (c) {
      const full = await (await fetch(`/api/characters/${c.id}`)).json();
      populate(full);
    }
  });

  root.querySelector('#ch-new').addEventListener('click', () => {
    listEl.value = '';
    populate(null);
    nameEl.focus();
    setOut('&gt; New character — fill in the fields and click SAVE CHARACTER.');
  });

  root.querySelector('#ch-del').addEventListener('click', async () => {
    const chars = await refreshList();
    const c = chars[parseInt(listEl.value)];
    if (!c) return;
    if (!confirm(`Delete character "${c.name}"?`)) return;
    await fetch(`/api/characters/${c.id}`, { method: 'DELETE' });
    if (activeCharacter && activeCharacter.name === c.name) activeCharacter = null;
    await refreshList();
    populate(null);
    setOut('&gt; Character deleted.', '#f4a261');
  });

  // Import a v2 card PNG (also captures its image as the avatar)
  root.querySelector('#ch-import').addEventListener('click', () => fileEl.click());
  fileEl.addEventListener('change', async () => {
    const file = fileEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const rr = await fetch('/api/characters/import', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ png: reader.result }),
        }).then(r => r.json());
        if (rr.error) { setOut('&gt; Import failed: ' + escHtml(rr.error), '#ff6b6b'); return; }
        populate(rr);
        setOut('&gt; Imported "' + escHtml(rr.name) + '". Click SAVE CHARACTER to store it.', '#f4a261');
      } catch (e) { setOut('&gt; Import error: ' + escHtml(e.message), '#ff6b6b'); }
    };
    reader.readAsDataURL(file);
    fileEl.value = '';
  });

  // Avatar upload
  root.querySelector('#ch-avatar-btn').addEventListener('click', () => avatarFileEl.click());
  avatarFileEl.addEventListener('change', () => {
    const f = avatarFileEl.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { setAvatar(r.result); setOut('&gt; Avatar set. Click SAVE CHARACTER to store it.', '#f4a261'); };
    r.readAsDataURL(f);
    avatarFileEl.value = '';
  });
  avatarClearBtn.addEventListener('click', () => { setAvatar(''); });

  // Export the currently loaded character as a v2 card PNG
  root.querySelector('#ch-export').addEventListener('click', async () => {
    const chars = await refreshList();
    const c = chars[parseInt(listEl.value)];
    if (!c) return;
    const a = document.createElement('a');
    a.href = `/api/characters/${c.id}/export`;
    a.download = `${c.name}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setOut('&gt; Exported "' + escHtml(c.name) + '" as PNG.', '#23c7a8');
  });

  function collectCard() {
    let character_book = {};
    const raw = loreEl.value.trim();
    if (raw) {
      try { character_book = JSON.parse(raw); }
      catch { setOut('&gt; Lorebook must be valid JSON.', '#ff6b6b'); return null; }
    }
    return {
      name: nameEl.value.trim(),
      description: descEl.value,
      personality: persEl.value,
      scenario: scenEl.value,
      first_mes: firstEl.value,
      mes_example: exEl.value,
      system_prompt: sysEl.value,
      post_history: postEl.value,
      character_book,
      tags: tagsEl.value.split(',').map(s => s.trim()).filter(Boolean),
      avatar: avatarData,
    };
  }

  root.querySelector('#ch-save').addEventListener('click', async () => {
    const card = collectCard();
    if (!card) return;
    if (!card.name) { setOut('&gt; Name is required.', '#ff6b6b'); return; }
    const rr = await fetch('/api/characters', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(card),
    }).then(r => r.json()).catch(e => ({ error: e.message }));
    if (rr.error) { setOut('&gt; Save failed: ' + escHtml(rr.error), '#ff6b6b'); return; }
    await refreshList();
    listEl.value = charsCache.findIndex(c => c.name === card.name);
    setOut('&gt; Character "' + escHtml(card.name) + '" saved.', '#23c7a8');
  });

  root.querySelector('#ch-use').addEventListener('click', async () => {
    const card = collectCard();
    if (!card) return;
    if (!card.name) { setOut('&gt; Name is required.', '#ff6b6b'); return; }
    activeCharacter = { ...card };
    addSystemMsg(`🎭 Now roleplaying as <strong>${escHtml(card.name)}</strong>. The model will adopt this character.`);
    openModals.get(id)?.close();
  });

  const off = (modalOffset % 5) * 24; modalOffset++;
  const wb = new WinBox({
    title: '🎭 Characters', width: '780px', height: '640px',
    x: `calc(50% - ${390 - off}px)`, y: `calc(50% - ${320 - off}px)`,
    background: '#4a4580', border: 2, mount: root,
    onclose() { openModals.delete(id); },
  });
  openModals.set(id, wb);
  refreshList();
}

</script>
</body>
</html>
