<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinBox AI Chat</title>

  <link rel="stylesheet" href="https://unpkg.com/winbox@0.2.82/dist/css/winbox.min.css" />
  <script src="https://unpkg.com/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="/tools/js/client_tools.js"></script>

  <style>
    /* ── Reset & base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Launcher ─────────────────────────────────── */
    #launcher { text-align: center; color: #ccc; }
    #launcher h1 { font-size: 2rem; font-weight: 700; color: #fff; letter-spacing: -.5px; margin-bottom: .4rem; }
    #launcher p  { font-size: .95rem; color: #888; margin-bottom: 1.5rem; }
    #launcher button {
      padding: .65rem 1.6rem; font-size: 1rem; font-weight: 600;
      background: #6c63ff; color: #fff; border: none; border-radius: 8px;
      cursor: pointer; transition: background .15s;
    }
    #launcher button:hover { background: #574fd6; }

    /* ── Chat root ────────────────────────────────── */
    #chat-root {
      display: flex; flex-direction: column; height: 100%;
      background: #1a1b23; color: #e0e0e0; font-size: 14px; overflow: hidden;
    }

    /* ── Toolbar ──────────────────────────────────── */
    #chat-toolbar {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; background: #13141b;
      border-bottom: 1px solid #2a2b38; flex-shrink: 0;
    }
    #chat-toolbar select, #chat-toolbar input[type="password"] {
      background: #22232e; border: 1px solid #33344a; color: #e0e0e0;
      border-radius: 6px; padding: 4px 8px; font-size: 12px; outline: none;
    }
    #model-select    { flex: 1.2; }
    #api-key-input   { flex: 1.8; letter-spacing: .08em; }
    #api-key-input::placeholder { color: #555; letter-spacing: 0; }

    .tb-btn {
      background: transparent; border: 1px solid #33344a; color: #888;
      border-radius: 6px; padding: 4px 9px; font-size: 12px;
      cursor: pointer; transition: color .15s, border-color .15s, background .15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .tb-btn:hover { color: #e0e0e0; border-color: #6c63ff; }
    .tb-btn.active { background: #6c63ff22; border-color: #6c63ff; color: #a89fff; }

    #db-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #444; flex-shrink: 0; cursor: default;
      transition: background .3s;
    }
    #db-dot.ok  { background: #23c7a8; }
    #db-dot.err { background: #ff6b6b; }
    #db-dot[title] { cursor: help; }

    /* ── Autocomplete bar ─────────────────────────── */
    #cmd-hint {
      display: none; position: absolute; z-index: 9999;
      background: #1e1f2b; border: 1px solid #33344a; border-radius: 8px;
      padding: 4px 0; min-width: 280px; max-width: 440px;
      box-shadow: 0 8px 24px #000a;
    }
    .hint-item {
      padding: 6px 12px; cursor: pointer; display: flex; gap: 10px;
      align-items: baseline;
    }
    .hint-item:hover, .hint-item.selected { background: #6c63ff33; }
    .hint-cmd   { color: #a89fff; font-family: monospace; font-size: 13px; }
    .hint-desc  { color: #666; font-size: 11px; }

    /* ── Messages ─────────────────────────────────── */
    #messages {
      flex: 1; overflow-y: auto; padding: 14px 12px;
      display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-thumb { background: #2e2f40; border-radius: 3px; }

    .msg { display: flex; gap: 10px; animation: fadeIn .18s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

    .msg.user      { flex-direction: row-reverse; }
    .msg.system    { justify-content: center; }
    .msg.tool-call { justify-content: flex-start; }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 2px;
    }
    .msg.user .avatar      { background: #6c63ff; }
    .msg.assistant .avatar { background: #23c7a8; }
    .msg.tool-call .avatar { background: #f4a261; }

    .bubble {
      max-width: 78%; padding: 9px 13px; border-radius: 12px;
      line-height: 1.55; word-break: break-word;
    }
    .msg.user .bubble      { background: #6c63ff; color: #fff; border-bottom-right-radius: 3px; }
    .msg.assistant .bubble { background: #22232e; border: 1px solid #2e2f40; border-bottom-left-radius: 3px; }
    .msg.system .bubble    { background: #1e1f2b; color: #9a9ab0; font-size: 12px; padding: 5px 10px; border-radius: 6px; border: 1px solid #2a2b38; }

    /* tool-call bubble */
    .msg.tool-call .bubble {
      background: #1e1f2b; border: 1px solid #f4a26133;
      border-bottom-left-radius: 3px; font-size: 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .tc-name  { color: #f4a261; font-family: monospace; }
    .tc-args  { color: #888; font-family: monospace; word-break: break-all; }
    .tc-badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 700; margin-top: 2px;
    }
    .tc-badge.ok  { background: #23c7a822; color: #23c7a8; }
    .tc-badge.err { background: #ff6b6b22; color: #ff6b6b; }

    /* markdown */
    .bubble p       { margin: 0 0 .5em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre     { background: #13141b; border: 1px solid #2a2b38; border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 12px; margin: .5em 0; }
    .bubble code    { background: #13141b; border-radius: 3px; padding: 1px 4px; font-size: 12px; }
    .bubble pre code { background: transparent; padding: 0; }
    .bubble ul, .bubble ol { padding-left: 1.4em; margin: .4em 0; }
    .bubble table   { border-collapse: collapse; font-size: 12px; width: 100%; }
    .bubble th, .bubble td { border: 1px solid #2e2f40; padding: 4px 8px; text-align: left; }
    .bubble th      { background: #13141b; color: #a89fff; }

    /* typing dots */
    .typing-dots span {
      display: inline-block; width: 6px; height: 6px;
      background: #23c7a8; border-radius: 50%; margin: 0 1px;
      animation: bounce .9s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

    /* ── Token / status bar ───────────────────────── */
    #status-bar {
      font-size: 11px; color: #444; padding: 2px 12px 3px;
      text-align: right; background: #13141b; flex-shrink: 0;
    }

    /* ── Input area ───────────────────────────────── */
    #input-wrap  { position: relative; }
    #input-area  {
      display: flex; gap: 8px; padding: 8px 10px;
      background: #13141b; border-top: 1px solid #2a2b38; flex-shrink: 0;
    }
    #user-input {
      flex: 1; background: #22232e; border: 1px solid #33344a; color: #e0e0e0;
      border-radius: 8px; padding: 8px 12px; font-size: 14px;
      outline: none; resize: none; min-height: 38px; max-height: 120px;
      line-height: 1.4; font-family: inherit; transition: border-color .15s;
    }
    #user-input:focus   { border-color: #6c63ff; }
    #user-input::placeholder { color: #555; }

    #btn-send {
      align-self: flex-end; background: #6c63ff; border: none; color: #fff;
      border-radius: 8px; width: 38px; height: 38px; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s; flex-shrink: 0;
    }
    #btn-send:hover:not(:disabled) { background: #574fd6; }
    #btn-send:disabled { opacity: .4; cursor: default; }

    /* ── Modal internals ──────────────────────────── */
    .modal-root {
      display: flex; flex-direction: column;
      height: 100%; background: #1a1b23; color: #e0e0e0;
      font-size: 13px; overflow: hidden;
    }
    .modal-body {
      flex: 1; overflow: auto; padding: 14px;
    }
    .modal-body::-webkit-scrollbar { width: 5px; }
    .modal-body::-webkit-scrollbar-thumb { background: #2e2f40; border-radius: 3px; }
    .modal-footer {
      padding: 10px 14px; border-top: 1px solid #2a2b38;
      display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0;
    }

    /* form elements inside modals */
    .modal-body label { display: block; color: #888; font-size: 11px; margin-bottom: 4px; margin-top: 12px; }
    .modal-body label:first-child { margin-top: 0; }
    .modal-body input[type="text"],
    .modal-body input[type="password"],
    .modal-body textarea,
    .modal-body select {
      width: 100%; background: #22232e; border: 1px solid #33344a;
      color: #e0e0e0; border-radius: 6px; padding: 7px 10px;
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    .modal-body input:focus,
    .modal-body textarea:focus { border-color: #6c63ff; }
    .modal-body textarea { resize: vertical; min-height: 80px; }

    /* buttons */
    .btn-primary, .btn-secondary, .btn-danger {
      padding: 6px 16px; border-radius: 6px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; transition: background .15s;
    }
    .btn-primary   { background: #6c63ff; color: #fff; }
    .btn-primary:hover   { background: #574fd6; }
    .btn-secondary { background: #22232e; color: #aaa; border: 1px solid #33344a; }
    .btn-secondary:hover { color: #fff; border-color: #555; }
    .btn-danger    { background: #ff4444; color: #fff; }
    .btn-danger:hover    { background: #cc0000; }

    /* data table inside modals */
    .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .data-table th { background: #13141b; color: #a89fff; padding: 6px 10px; border: 1px solid #2e2f40; text-align: left; position: sticky; top: 0; }
    .data-table td { padding: 5px 10px; border: 1px solid #2e2f40; color: #ccc; }
    .data-table tr:hover td { background: #22232e; }
    .data-table-wrap { overflow: auto; max-height: 100%; }

    /* log stream */
    .log-stream {
      font-family: monospace; font-size: 12px; background: #13141b;
      border-radius: 6px; padding: 10px; height: 100%;
      overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      color: #ccc; line-height: 1.6;
    }
    .log-stream .log-tool   { color: #f4a261; }
    .log-stream .log-ok     { color: #23c7a8; }
    .log-stream .log-err    { color: #ff6b6b; }
    .log-stream .log-done   { color: #a89fff; font-weight: bold; }

    /* help table */
    .help-table { width: 100%; border-collapse: collapse; }
    .help-table td { padding: 6px 10px; border-bottom: 1px solid #2a2b38; vertical-align: top; }
    .help-table td:first-child { color: #a89fff; font-family: monospace; white-space: nowrap; }
    .help-table td:last-child  { color: #888; }
    .help-table tr:last-child td { border-bottom: none; }

    /* confirm modal */
    .confirm-msg { color: #e0e0e0; line-height: 1.6; padding-bottom: 4px; }
    .confirm-msg strong { color: #ff6b6b; }

    /* ── Model Picker ─────────────────────────────── */
    .mp-wrap { display: flex; flex-direction: column; height: 100%; }
    .mp-controls {
      display: flex; gap: 6px; padding: 8px 10px;
      background: #13141b; border-bottom: 1px solid #2a2b38; flex-shrink: 0;
    }
    #mp-search {
      flex: 1; background: #22232e; border: 1px solid #33344a; color: #e0e0e0;
      border-radius: 6px; padding: 5px 10px; font-size: 12px; outline: none;
      font-family: inherit;
    }
    #mp-search:focus { border-color: #6c63ff; }
    #mp-cap, #mp-sort {
      background: #22232e; border: 1px solid #33344a; color: #e0e0e0;
      border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; cursor: pointer;
    }
    .mp-table-wrap { flex: 1; overflow-y: auto; }
    .mp-table-wrap::-webkit-scrollbar { width: 5px; }
    .mp-table-wrap::-webkit-scrollbar-thumb { background: #2e2f40; border-radius: 3px; }
    .mp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .mp-table thead th {
      background: #13141b; color: #a89fff; padding: 7px 10px;
      border-bottom: 1px solid #2e2f40; text-align: left;
      position: sticky; top: 0; font-size: 11px; font-weight: 600;
      letter-spacing: .4px; white-space: nowrap;
    }
    .mp-row { cursor: pointer; border-bottom: 1px solid #1e1f2b; }
    .mp-row:hover td { background: #22232e; }
    .mp-row-selected td { background: #6c63ff22 !important; }
    .mp-row td { padding: 6px 10px; color: #ccc; vertical-align: middle; }
    .mp-col-name { min-width: 200px; max-width: 280px; }
    .mp-model-name { color: #e0e0e0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-model-id   { color: #555; font-size: 10px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-col-num    { text-align: right; white-space: nowrap; font-family: monospace; font-size: 11px; }
    .mp-badge {
      display: inline-block; padding: 1px 5px; border-radius: 3px;
      font-size: 10px; font-weight: 700; margin-right: 2px; letter-spacing: .3px;
    }
    .mp-badge-text  { background: #2d3a5c; color: #7ab3ff; }
    .mp-badge-image { background: #1f3c2e; color: #4fd1a5; }
    .mp-badge-audio { background: #3c2d50; color: #c97aff; }
    .mp-badge-file  { background: #3c3020; color: #ffba6b; }
    .mp-price-free  { color: #23c7a8; }
    .mp-price-cheap { color: #a8d8a0; }
    .mp-price-mid   { color: #f4a261; }
    .mp-price-exp   { color: #ff6b6b; }
    .mp-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #13141b; border-top: 1px solid #2a2b38; flex-shrink: 0;
    }
    .mp-count { color: #555; font-size: 11px; }

    /* ── Agent Profiles Modal ────────────────────────── */
    .ap-root {
      display: flex; height: 100%;
      background: #1a1b23; color: #e0e0e0; font-size: 13px; overflow: hidden;
    }
    .ap-left {
      width: 210px; flex-shrink: 0; border-right: 1px solid #2a2b38;
      display: flex; flex-direction: column; padding: 10px; gap: 6px;
    }
    .ap-section-title {
      font-size: 11px; font-weight: 600; color: #a89fff;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .ap-dropdown {
      width: 100%; background: #22232e; border: 1px solid #33344a;
      color: #e0e0e0; border-radius: 6px; padding: 5px 8px;
      font-size: 12px; outline: none; cursor: pointer; font-family: inherit;
    }
    .ap-dropdown:focus { border-color: #6c63ff; }
    .ap-spacer { flex: 1; }
    .ap-btn-row { display: flex; gap: 4px; }
    .ap-btn { flex: 1; border: none; border-radius: 5px; padding: 6px 2px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .ap-btn-use  { background: #2244cc; color: #fff; }
    .ap-btn-use:hover  { background: #1a35b0; }
    .ap-btn-edit { background: #22aa44; color: #fff; }
    .ap-btn-edit:hover { background: #199939; }
    .ap-btn-del  { background: #cc2222; color: #fff; }
    .ap-btn-del:hover  { background: #aa1515; }
    .ap-right {
      flex: 1; display: flex; flex-direction: column;
      padding: 12px; gap: 3px; overflow-y: auto; min-width: 0;
    }
    .ap-lbl { font-size: 11px; color: #888; margin-top: 8px; }
    .ap-lbl:first-child { margin-top: 0; }
    .ap-inp {
      width: 100%; background: #22232e; border: 1px solid #33344a;
      color: #e0e0e0; border-radius: 6px; padding: 6px 9px;
      font-size: 12px; font-family: inherit; outline: none; transition: border-color .15s;
    }
    .ap-inp:focus { border-color: #6c63ff; }
    textarea.ap-inp { resize: vertical; }
    .ap-save {
      margin-top: 10px; width: 100%;
      background: #22aa44; color: #fff; border: none; border-radius: 6px;
      padding: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .ap-save:hover { background: #199939; }

    /* ── Tools Engine Modal ──────────────────────────── */
    .te-root {
      display: flex; height: 100%;
      background: #1a1b23; color: #e0e0e0; font-size: 13px; overflow: hidden;
    }
    .te-left {
      width: 190px; flex-shrink: 0; border-right: 1px solid #2a2b38;
      display: flex; flex-direction: column; padding: 10px; gap: 6px;
    }
    .te-section-title {
      font-size: 11px; font-weight: 600; color: #a89fff;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .te-toggle {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #e0e0e0; cursor: pointer;
      padding: 6px 8px; background: #22232e; border: 1px solid #33344a;
      border-radius: 6px; user-select: none;
    }
    .te-toggle input { accent-color: #6c63ff; cursor: pointer; }
    .te-list {
      flex: 1; width: 100%; background: #22232e; border: 1px solid #33344a;
      color: #e0e0e0; border-radius: 6px; padding: 4px;
      font-size: 12px; font-family: monospace; outline: none; overflow-y: auto;
    }
    .te-list option { padding: 4px 6px; }
    .te-left-btns { display: flex; flex-direction: column; gap: 4px; }
    .te-btn-edit {
      width: 100%; background: transparent; color: #e0e0e0;
      border: 1px solid #33344a; border-radius: 5px; padding: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .te-btn-edit:hover { border-color: #6c63ff; color: #a89fff; }
    .te-btn-del {
      width: 100%; background: #1a0a0a; color: #ff6b6b;
      border: 1px solid #ff444433; border-radius: 5px; padding: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .te-btn-del:hover { background: #ff444422; }
    .te-right {
      flex: 1; display: flex; flex-direction: column;
      padding: 12px; gap: 3px; overflow-y: auto; min-width: 0;
    }
    .te-lbl { font-size: 11px; color: #888; margin-top: 6px; }
    .te-lbl:first-child { margin-top: 0; }
    .te-inp {
      width: 100%; background: #22232e; border: 1px solid #33344a;
      color: #e0e0e0; border-radius: 6px; padding: 6px 9px;
      font-size: 12px; font-family: inherit; outline: none; transition: border-color .15s;
    }
    .te-inp:focus { border-color: #6c63ff; }
    textarea.te-inp { resize: vertical; min-height: 50px; }
    .te-code { font-family: monospace !important; }
    .te-terminal {
      margin-top: 6px; background: #0d0d0d; border-radius: 6px;
      padding: 8px 12px; font-family: monospace; font-size: 12px;
      color: #23c7a8; min-height: 38px; line-height: 1.5; white-space: pre-wrap;
    }
    .te-action-row { display: flex; gap: 6px; margin-top: 6px; }
    .te-btn-test {
      flex: 1; background: #7c3aed; color: #fff; border: none;
      border-radius: 6px; padding: 7px; font-size: 12px; font-weight: 700;
      cursor: pointer; text-transform: uppercase;
    }
    .te-btn-test:hover { background: #6d28d9; }
    .te-btn-save {
      flex: 1; background: #111827; color: #fff;
      border: 1px solid #374151; border-radius: 6px; padding: 7px;
      font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase;
    }
    .te-btn-save:hover { background: #1f2937; }

    /* ── Upload button & file preview ───────────────── */
    #btn-upload {
      align-self: flex-end; background: #22232e; border: 1px solid #33344a;
      color: #777; border-radius: 8px; width: 38px; height: 38px; font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: color .15s, border-color .15s;
    }
    #btn-upload:hover { color: #e0e0e0; border-color: #6c63ff; }
    #btn-upload.has-files { border-color: #23c7a8; color: #23c7a8; }
    #file-preview {
      display: none; flex-wrap: wrap; gap: 4px;
      padding: 5px 10px 0; background: #13141b;
    }
    #file-preview.visible { display: flex; }
    .file-chip {
      display: flex; align-items: center; gap: 4px; max-width: 200px;
      background: #22232e; border: 1px solid #33344a; border-radius: 5px;
      padding: 2px 7px; font-size: 11px; color: #aaa; cursor: default;
    }
    .file-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chip-x { cursor: pointer; color: #555; font-size: 13px; flex-shrink: 0; }
    .file-chip-x:hover { color: #ff6b6b; }
    .attach-label { font-size: 11px; color: #888; font-style: italic; }
        .chat-img { max-width: 260px; max-height: 260px; border-radius: 8px; border: 1px solid #2e2f40; display: block; margin: 4px 0; object-fit: cover; }

    /* ── Text/Code Editor Widget ─────────────────────── */
    .ed-root { display:flex; flex-direction:column; height:100%; background:#111218; overflow:hidden; }

  </style>
</head>
<body>

<div id="launcher">
  <h1>🤖 WinBox AI</h1>
  <p>AI chat with slash-command database tools — powered by OpenRouter</p>
  <button onclick="openChatWindow()">Open Chat</button>
</div>

<template id="chat-template">
  <div id="chat-root">

    <div id="chat-toolbar">
      <!-- hidden state holders — keep in DOM for all existing read/write logic -->
      <select id="model-select" style="display:none">
        <optgroup label="Anthropic">
          <option value="anthropic/claude-sonnet-4-5">Claude Sonnet 4.5</option>
          <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku</option>

        </optgroup>
        <optgroup label="OpenAI">
          <option value="openai/gpt-4o">GPT-4o</option>
          <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
        </optgroup>
        <optgroup label="Google">
          <option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash</option>
        </optgroup>
        <optgroup label="Meta">
          <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
        </optgroup>
      </select>
      <input id="api-key-input" type="password" style="display:none" placeholder="OpenRouter API key…" />

      <button id="btn-models"      class="tb-btn" title="Browse & select AI model">⊞ Model</button>
      <button id="btn-tools"       class="tb-btn" title="Toggle AI DB tool-use">⚙ Tools</button>
      <button id="btn-agents"      class="tb-btn" title="Manage agent profiles">👤 Agents</button>
      <button id="btn-tools-engine" class="tb-btn" title="Custom tools engine">⚒ Engine</button>
      <button id="btn-files"       class="tb-btn" title="File Explorer — DB-backed files">🗂 Files</button>
      <button id="btn-skills"      class="tb-btn" title="Manage AI skills">🧠 Skills</button>
            <button id="btn-characters"  class="tb-btn" title="Manage roleplay character cards">🎭 Characters</button>
      <button id="btn-editor"      class="tb-btn" title="Open text / code editor">📝 Editor</button>
      <button id="btn-convos"      class="tb-btn" title="Manage conversations">💬 Convos</button>
      <button id="btn-settings"    class="tb-btn" title="Settings — API key & model">⚙ Settings</button>

    </div>

    <div id="messages">
      <div class="msg system">
        <div class="bubble">Enter your OpenRouter API key, pick a model, and chat — or type <strong>/help</strong> for DB commands.</div>
      </div>
    </div>

    <div id="status-bar">tokens: 0</div>

    <div id="input-wrap">
      <div id="cmd-hint"></div>
      <div id="file-preview"></div>
      <div id="input-area">
        <input type="file" id="file-input" style="display:none" multiple
          accept="image/*,text/*,.pdf,.csv,.json,.jsonl,.md,.py,.js,.ts,.jsx,.tsx,.html,.css,.yaml,.yml,.xml,.sql,.sh,.env" />
        <button id="btn-upload" title="Attach image or file">📎</button>
        <textarea id="user-input" rows="1" placeholder="Message or /command…"></textarea>
        <button id="btn-send" title="Send">&#x27A4;</button>
      </div>
    </div>

  </div>
</template>

<script>

/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
let history          = [];
const MAX_HISTORY   = 200; // cap messages sent to the model to bound request size
let totalTokens      = 0;
let streaming        = false;
let toolsEnabled     = false;
let dbTools          = [];
let winInstance      = null;
let chatDoc          = null;
let pendingAttachments = [];
let activeAgent      = null;
let cmdHistoryArr = JSON.parse(localStorage.getItem('cmdHistory') || '[]');
let cmdHistoryIdx = -1;

// Server auth token (optional — only needed if the server runs with AUTH_TOKEN set).
let authToken = localStorage.getItem('winboxai_auth_token') || '';

// Inject the auth token into every /api/* request so callers don't each need to.
const _origFetch = window.fetch;
window.fetch = function (url, opts = {}) {
  if (typeof url === 'string' && url.startsWith('/api/') && authToken) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'X-Auth-Token': authToken });
  }
  return _origFetch(url, opts);
};

// ── API provider presets ─────────────────────────────────────────────────────
// Each entry is an OpenAI-compatible inference provider. The base URL is the
// root the client calls <base>/chat/completions and <base>/models against.
const API_PROVIDERS = [
  { name: 'OpenRouter',  baseUrl: 'https://openrouter.ai/api/v1',        keyPlaceholder: 'sk-or-…' },
  { name: 'Venice',      baseUrl: 'https://api.venice.ai/api/v1',        keyPlaceholder: 'sk-…' },
  { name: 'Groq',        baseUrl: 'https://api.groq.com/openai/v1',      keyPlaceholder: 'gsk_…' },
  { name: 'Together',    baseUrl: 'https://api.together.xyz/v1',         keyPlaceholder: '…' },
  { name: 'Fireworks',   baseUrl: 'https://api.fireworks.ai/inference/v1', keyPlaceholder: '…' },
  { name: 'Cerebras',    baseUrl: 'https://api.cerebras.ai/v1',          keyPlaceholder: '…' },
  { name: 'Featherless', baseUrl: 'https://api.featherless.ai/v1',       keyPlaceholder: '…' },
  { name: 'Custom',      baseUrl: '',                                     keyPlaceholder: '…' },
];

// Build <option> list for a provider <select>, marking `selectedName`.
function providerOptions(selectedName) {
  return API_PROVIDERS.map(p =>
    `<option value="${escHtml(p.name)}" ${p.name === selectedName ? 'selected' : ''}>${escHtml(p.name)}</option>`
  ).join('');
}
// Persisted provider selection + custom base URL.
let apiProvider = localStorage.getItem('winboxai_provider') || 'OpenRouter';
let apiBaseUrl  = localStorage.getItem('winboxai_base_url') || '';
// Image generation has its own provider/key so chat and images can use
// different providers (e.g. chat on OpenRouter, images on Venice).
let imageProvider = localStorage.getItem('winboxai_image_provider') || 'Venice';
let imageBaseUrl  = localStorage.getItem('winboxai_image_base_url') || '';
let imageApiKey   = localStorage.getItem('winboxai_image_api_key') || '';
// Image-generation model (used by /imagine and the generate_image tool).
let imageModel  = localStorage.getItem('winboxai_image_model') || 'ideogram-v4';

// Resolve the base URL / key for the IMAGE provider.
function getImageApiBaseUrl() {
  const p = API_PROVIDERS.find(x => x.name === imageProvider);
  if (p && p.name !== 'Custom') return p.baseUrl;
  return imageBaseUrl || 'https://api.venice.ai/api/v1';
}
function getImageApiKey() {
  return (imageApiKey || chatDoc.apiKey.value).trim();
}

// Resolve the effective base URL for the current provider.
function getApiBaseUrl() {
  const p = API_PROVIDERS.find(x => x.name === apiProvider);
  if (p && p.name !== 'Custom') return p.baseUrl;
  return apiBaseUrl || 'https://openrouter.ai/api/v1';
}
// Resolve the key placeholder for the current provider.
function getApiKeyPlaceholder() {
  const p = API_PROVIDERS.find(x => x.name === apiProvider);
  return (p && p.keyPlaceholder) || 'sk-…';
}
// Normalize a base URL so it has no trailing slash (for clean path joins).
function normBaseUrl(u) { return (u || '').replace(/\/+$/, ''); }

const openModals = new Map(); // id → WinBox instance
let modalOffset  = 0;

/* ══════════════════════════════════════════════════════
   OPEN MAIN CHAT WINDOW
══════════════════════════════════════════════════════ */
function openChatWindow() {
  if (winInstance) { winInstance.focus(); return; }

  const tpl   = document.getElementById('chat-template');
  const clone = tpl.content.cloneNode(true);
  const root  = clone.querySelector('#chat-root');

  const holder = document.createElement('div');
  holder.style.display = 'none';
  document.body.appendChild(holder);
  holder.appendChild(root);

  winInstance = new WinBox({
    title: '🤖 AI Chat',
    width: '500px', height: '620px',
    x: 'center', y: 'center',
    background: '#6c63ff',
    border: 2,
    onclose() {
      winInstance = null; chatDoc = null;
      document.body.removeChild(holder);
    },
    mount: root,
  });

  chatDoc = {
    messages:    root.querySelector('#messages'),
    modelSel:    root.querySelector('#model-select'),
    apiKey:      root.querySelector('#api-key-input'),
    input:       root.querySelector('#user-input'),
    sendBtn:     root.querySelector('#btn-send'),
    clearBtn:    root.querySelector('#btn-clear'),
    modelsBtn:   root.querySelector('#btn-models'),
    toolsBtn:    root.querySelector('#btn-tools'),
    agentsBtn:   root.querySelector('#btn-agents'),
    toolsEngBtn: root.querySelector('#btn-tools-engine'),
    filesBtn:    root.querySelector('#btn-files'),
    skillsBtn:   root.querySelector('#btn-skills'),
    charactersBtn: root.querySelector('#btn-characters'),
    editorBtn:   root.querySelector('#btn-editor'),
    convosBtn:   root.querySelector('#btn-convos'),
    settingsBtn: root.querySelector('#btn-settings'),
    uploadBtn:   root.querySelector('#btn-upload'),
    fileInput:   root.querySelector('#file-input'),
    filePreview: root.querySelector('#file-preview'),
    dbDot:       root.querySelector('#db-dot'),
    statusBar:   root.querySelector('#status-bar'),
    cmdHint:     root.querySelector('#cmd-hint'),
    inputWrap:   root.querySelector('#input-wrap'),
  };

  wireEvents();
  fetchDbTools();
  loadSkillsMeta();
  loadCustomTools();
  checkDbStatus();
  setInterval(checkDbStatus, 30000);
}

/* ══════════════════════════════════════════════════════
   WIRE EVENTS
══════════════════════════════════════════════════════ */
function wireEvents() {
  const { input, sendBtn, clearBtn, toolsBtn, modelsBtn } = chatDoc;

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', e => {
    // Command history navigation
    if (e.key === 'ArrowUp') {
      if (hintsVisible()) { e.preventDefault(); navigateHints(-1); return; }
      if (input.value.startsWith('/')) { e.preventDefault(); navigateCmdHistory(1); return; }
    }
    if (e.key === 'ArrowDown') {
      if (hintsVisible()) { e.preventDefault(); navigateHints(1); return; }
      if (input.value.startsWith('/')) { e.preventDefault(); navigateCmdHistory(-1); return; }
    }
    if (e.key === 'Tab')    { e.preventDefault(); applyHintSelection(); return; }
    if (e.key === 'Escape') { hideHints(); return; }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (hintsVisible()) { applyHintSelection(); return; }
      sendMessage(); return;
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    updateHints(input.value);
  });

  clearBtn.addEventListener('click', cmdClear);
  modelsBtn.addEventListener('click', openModelPicker);
  chatDoc.agentsBtn.addEventListener('click', openAgentsModal);
  chatDoc.toolsEngBtn.addEventListener('click', openToolsModal);
  chatDoc.filesBtn.addEventListener('click', openFileExplorer);
  chatDoc.skillsBtn.addEventListener('click', openSkillsModal);
  chatDoc.charactersBtn.addEventListener('click', openCharactersModal);
  chatDoc.editorBtn.addEventListener('click', () => openEditorWindow());
  chatDoc.convosBtn.addEventListener('click', openConversationsModal);
  chatDoc.settingsBtn.addEventListener('click', cmdSettings);

  chatDoc.uploadBtn.addEventListener('click', () => chatDoc.fileInput.click());
  chatDoc.fileInput.addEventListener('change', handleFileSelection);

  toolsBtn.addEventListener('click', () => openToolsModal());

  // Close hints on outside click
  document.addEventListener('click', e => {
    if (!chatDoc) return;
    if (!chatDoc.cmdHint.contains(e.target) && e.target !== chatDoc.input) hideHints();
  });
}

/* ══════════════════════════════════════════════════════
   AUTOCOMPLETE HINTS
══════════════════════════════════════════════════════ */
function updateHints(val) {
  const hint = chatDoc.cmdHint;
  if (!val.startsWith('/') || val.includes(' ')) { hideHints(); return; }

  const prefix = val.slice(1).toLowerCase();
  const matches = Object.entries(COMMANDS).filter(([k]) => k.startsWith(prefix));

  if (!matches.length || (matches.length === 1 && matches[0][0] === prefix)) {
    hideHints(); return;
  }

  hint.innerHTML = '';
  matches.forEach(([cmd, info], i) => {
    const el = document.createElement('div');
    el.className = 'hint-item' + (i === 0 ? ' selected' : '');
    el.innerHTML = `<span class="hint-cmd">/${info.usage.split(' ').slice(1).length ? info.usage : cmd}</span><span class="hint-desc">${info.desc}</span>`;
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      chatDoc.input.value = '/' + cmd + (info.usage.includes('<') ? ' ' : '');
      hideHints();
      chatDoc.input.focus();
    });
    hint.appendChild(el);
  });

  // Position above the input area
  const wrap = chatDoc.inputWrap;
  const hintH = Math.min(matches.length * 34 + 8, 200);
  hint.style.cssText = `display:block; bottom:${wrap.offsetHeight + 2}px; left:10px;`;
}

function hideHints() {
  if (chatDoc) chatDoc.cmdHint.style.display = 'none';
}

function hintsVisible() {
  const h = chatDoc?.cmdHint;
  return h && h.style.display !== 'none' && !!h.querySelector('.hint-item');
}

function navigateHints(dir) {
  const items = [...chatDoc.cmdHint.querySelectorAll('.hint-item')];
  if (!items.length) return;
  const cur = items.findIndex(el => el.classList.contains('selected'));
  const next = (cur + dir + items.length) % items.length;
  items.forEach((el, i) => el.classList.toggle('selected', i === next));
  items[next].scrollIntoView({ block: 'nearest' });
}

function applyHintSelection() {
  const sel = chatDoc.cmdHint.querySelector('.hint-item.selected');
  if (sel) sel.dispatchEvent(new MouseEvent('mousedown'));
}

function navigateCmdHistory(dir) {
  if (!cmdHistoryArr.length) return;
  cmdHistoryIdx = Math.max(-1, Math.min(cmdHistoryArr.length - 1, cmdHistoryIdx + dir));
  chatDoc.input.value = cmdHistoryIdx >= 0 ? cmdHistoryArr[cmdHistoryArr.length - 1 - cmdHistoryIdx] : '';
}

/* ══════════════════════════════════════════════════════
   MESSAGE HELPERS
══════════════════════════════════════════════════════ */
function addSystemMsg(html) {
  const el = document.createElement('div');
  el.className = 'msg system';
  el.innerHTML = `<div class="bubble">${html}</div>`;
  chatDoc.messages.appendChild(el);
  scrollBottom();
}

function addBubble(role, html) {
  const emoji = role === 'user' ? '👤' : '🤖';
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = `<div class="avatar">${emoji}</div><div class="bubble">${html}</div>`;
  chatDoc.messages.appendChild(el);
  scrollBottom();
  return el.querySelector('.bubble');
}

let toolCallSeq = 0; // monotonic counter so badge IDs are always unique
function addToolCallBubble(name, args) {
  const el = document.createElement('div');
  el.className = 'msg tool-call';
  const preview = JSON.stringify(args).slice(0, 120);
  el.innerHTML = `
    <div class="avatar">⚙</div>
    <div class="bubble">
      <div class="tc-name">${name}</div>
      <div class="tc-args">${escHtml(preview)}${preview.length >= 120 ? '…' : ''}</div>
      <div class="tc-badge" id="tcb-${name}-${++toolCallSeq}"></div>
    </div>`;
  chatDoc.messages.appendChild(el);
  scrollBottom();
  return el.querySelector('.tc-badge');
}

function addTypingIndicator() {
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.id = 'typing-indicator';
  el.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  chatDoc.messages.appendChild(el);
  scrollBottom();
}

function removeTypingIndicator() {
  document.getElementById('typing-indicator')?.remove();
}

function scrollBottom() {
  chatDoc.messages.scrollTop = chatDoc.messages.scrollHeight;
}

/* ══════════════════════════════════════════════════════
   SEND MESSAGE / COMMAND ROUTER
══════════════════════════════════════════════════════ */
async function sendMessage() {
  if (streaming) return;
  hideHints();

  const text = chatDoc.input.value.trim();
  if (!text && !pendingAttachments.length) return;

  chatDoc.input.value = '';
  chatDoc.input.style.height = 'auto';
  cmdHistoryIdx = -1;

  if (text.startsWith('/')) {
    pushCmdHistory(text);
    return handleCommand(text);
  }

  const key   = chatDoc.apiKey.value.trim();
  const model = chatDoc.modelSel.value;
  if (!key) { addSystemMsg('⚠ Enter your OpenRouter API key — open ⚙ Settings.'); return; }

  // Build bubble HTML (text + attachment chips)
  const attachHtml = pendingAttachments.map(a =>
      a.isImage
        ? `<img class="chat-img" src="${a.data}" alt="${escHtml(a.name)}" title="${escHtml(a.name)}" />`
        : `<span class="attach-label"> 📎 ${escHtml(a.name)}</span>`).join('');
    addBubble('user', (text ? escHtml(text).replace(/\n/g,'<br>') : '') + attachHtml);

  // Build history content — array when attachments present, string otherwise
  if (pendingAttachments.length) {
    const parts = [];
    if (text) parts.push({ type: 'text', text });
    for (const a of pendingAttachments) {
      if (a.isImage) {
        parts.push({ type: 'image_url', image_url: { url: a.data } });
      } else {
        parts.push({ type: 'text', text: `\n\n📎 **${a.name}**\n\`\`\`\n${a.data}\n\`\`\`` });
      }
    }
    history.push({ role: 'user', content: parts });
    pendingAttachments = [];
    updateFilePreview();
  } else {
    history.push({ role: 'user', content: text });
  }

  streaming = true;
  chatDoc.sendBtn.disabled = true;
  addTypingIndicator();

  try {
    await runAiTurn(key, model);
  } catch (e) {
    addSystemMsg(`❌ ${escHtml(e.message || e)}`);
  } finally {
    streaming = false;
    chatDoc.sendBtn.disabled = false;
    removeTypingIndicator(); // always clear the ellipsis, even on error
    scrollBottom();
  }
}

function pushCmdHistory(text) {
  cmdHistoryArr = cmdHistoryArr.filter(c => c !== text);
  cmdHistoryArr.push(text);
  if (cmdHistoryArr.length > 50) cmdHistoryArr.shift();
  localStorage.setItem('cmdHistory', JSON.stringify(cmdHistoryArr));
}

/* ══════════════════════════════════════════════════════
   AI TURN (supports tool-use loop)
══════════════════════════════════════════════════════ */
async function runAiTurn(key, model) {
  let bubble    = null;
  let fullText  = '';
  let firstCall = true;
  let iterations = 0;
  const MAX_ITER = 25; // safety cap on the tool-call loop
  let lastFeatherlessCall = ''; // "name(argsJSON)" of the previous round — guards duplicates
  let featherlessNudged = false; // fires the JSON-lock nudge at most once per conversation

  while (true) {
    iterations++;
    if (iterations > MAX_ITER) {
      addSystemMsg(`⚠ Stopped after ${MAX_ITER} tool-call rounds (possible runaway loop).`);
      break;
    }
    // Bound the request: keep the system message (if any) + the most recent messages.
    const sysIdx = history.findIndex(m => m.role === 'system');
    const sysMsg = sysIdx >= 0 ? history[sysIdx] : null;
    const tail   = history.slice(sysIdx >= 0 ? sysIdx + 1 : 0);
    const trimmed = tail.length > MAX_HISTORY ? tail.slice(-MAX_HISTORY) : tail;

    // Level 1: inject available-skill metadata into the system prompt so the AI
    // knows what skills exist and can trigger skill_read on demand.
    let systemContent = sysMsg ? sysMsg.content : '';
    // Inject the active character card (roleplay profile) ahead of everything.
    if (activeCharacter) {
      const ctxText = trimmed.map(m => (typeof m.content === 'string' ? m.content : '')).join(' ');
      systemContent = buildCharacterSystemPrompt(activeCharacter, ctxText)
        + (systemContent ? '\n\n' + systemContent : '');
    }
    if (skillsMeta.length) {
      const skillList = skillsMeta.map(s => `- ${s.name}: ${s.description}`).join('\n');
      const skillBlock = `\n\nAvailable AI skills (call skill_read with a skill's name to load its instructions when relevant):\n${skillList}`;
      systemContent = (systemContent ? systemContent + skillBlock : 'You are a helpful assistant.' + skillBlock);
    }

    // ── Featherless: prompt-based tool calling (JSON mode) ──────────────────
    // Featherless models don't reliably return native tool_calls deltas, so we
    // describe the tools in the system prompt and ask for a strict JSON reply
    // naming the function + arguments. The synthesized call then flows through
    // the exact same dispatcher as the native path below.
    let featherlessMode = false;
    if (toolsEnabled && apiProvider === 'Featherless') {
      const allTools = [EDITOR_TOOL, SKILL_READ_TOOL, CREATE_CUSTOM_TOOL, CREATE_SKILL_TOOL, GENERATE_IMAGE_TOOL, SUBAGENT_TOOL, ...FILE_TOOLS, ...dbTools, ...buildCustomToolDefs()];
      const activeTools = filterToolsForAgent(allTools, activeAgent?.tools);
      if (activeTools.length) {
        featherlessMode = true;
        const toolDesc = activeTools.map(t =>
          `- ${t.function.name}: ${t.function.description || ''}\n  parameters: ${JSON.stringify(t.function.parameters || {})}`
        ).join('\n');
        systemContent =
          (systemContent || 'You are a helpful assistant.') +
          '\n\n# Tool calling protocol\n' +
          'You have access to the following functions:\n' + toolDesc + '\n\n' +
          '## How to call a function\n' +
          'ONLY when you intend to CALL a function, respond with exactly one JSON object and nothing else:\n' +
          '{"function": "<function_name>", "arguments": {<args object>}}\n' +
          'No text before or after the JSON, no markdown fences.\n\n' +
          '## After a function result\n' +
          'Messages like [Function "name" result]: ... are RESULTS of functions you called. ' +
          'When you see one, USE that result and answer the user in normal, conversational plain text. ' +
          'NEVER output a JSON object as your final answer to the user — always answer in plain text sentences. ' +
          'Do not call the same function again with identical arguments; reuse the result you already have.\n\n' +
          '## When NOT to call a function\n' +
          'For greetings, opinions, explanations, or anything a tool cannot help with, reply directly ' +
          'in plain text. Do not output JSON in that case.';
      }
    }

    let messages;
    if (featherlessMode) {
      // JSON-mode providers can't necessarily handle native tool_calls/tool
      // role entries, so flatten prior rounds into plain text turns.
      const flat = trimmed.map(m => {
        if (m.role === 'tool') {
          return { role: 'user', content: `(system note — result of your function call) Function "${m.__fnName || 'function'}" returned: ${m.content}\n(Use this result to answer the user in plain text. Do not repeat the function call.)` };
        }
        if (m.role === 'assistant' && m.tool_calls) {
          const calls = m.tool_calls.map(tc => {
            let a = {}; try { a = JSON.parse(tc.function.arguments); } catch {}
            return `${tc.function.name}(${JSON.stringify(a)})`;
          }).join('; ');
          return { role: 'assistant', content: `I will call ${calls}.` };
        }
        return { role: m.role, content: m.content };
      });
      messages = systemContent
        ? [{ role: 'system', content: systemContent }, ...flat]
        : flat;
    } else {
      messages = systemContent
        ? [{ role: 'system', content: systemContent }, ...trimmed]
        : trimmed;
    }

    const body = {
      model,
      messages,
      stream: !featherlessMode, // JSON-mode tool calls are non-streaming
    };

    // NOTE: no response_format in Featherless mode — json_object forces EVERY
    // reply to be a JSON object, making plain-text answers impossible (the
    // model emitted {"function": "", ...} instead of prose in live logs).
    // The system prompt alone carries the call-if-needed protocol.
    if (!featherlessMode && toolsEnabled) {
      const allTools = [EDITOR_TOOL, SKILL_READ_TOOL, CREATE_CUSTOM_TOOL, CREATE_SKILL_TOOL, GENERATE_IMAGE_TOOL, SUBAGENT_TOOL, ...FILE_TOOLS, ...dbTools, ...buildCustomToolDefs()];
      const activeTools = filterToolsForAgent(allTools, activeAgent?.tools);
      if (activeTools.length) { body.tools = activeTools; body.tool_choice = 'auto'; }
    }

    const response = await fetch('/api/chat', {
              method:  'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...body, apiKey: key, baseUrl: normBaseUrl(getApiBaseUrl()) }),
            });

    if (!response.ok) {
          const raw = await response.text().catch(() => '');
          let msg = '';
          try {
            const j = JSON.parse(raw);
            msg = j?.error?.message || j?.error || (typeof j === 'string' ? j : '');
          } catch { msg = raw; }
          throw new Error(msg || `HTTP ${response.status}`);
        }

    removeTypingIndicator(); // always remove — tool-call loops re-add it
    firstCall = false;

    let pendingToolCalls = []; // accumulate streamed tool call deltas
    let finishReason = null;
    let assistantMsg = { role: 'assistant', content: '' };

    if (featherlessMode) {
      // Non-streaming JSON-mode turn: read the full body, parse the reply, and
      // either synthesize a tool call or treat the content as normal text.
      const dataF = await response.json();
      if (dataF.usage) {
        totalTokens += dataF.usage.total_tokens || 0;
        chatDoc.statusBar.textContent = `tokens: ${totalTokens.toLocaleString()}`;
      }
      // Some Featherless models return the reply in `reasoning` or
      // `reasoning_content` with empty `content`; fall back so we don't
      // report an empty response.
      const msgF  = dataF.choices?.[0]?.message || {};
      const content = msgF.content || msgF.reasoning || msgF.reasoning_content || '';
      if (!content) console.warn('[Featherless] empty reply:', JSON.stringify(dataF).slice(0, 800));

      // Lenient parse: strip code fences, then grab the first {...} block.
      let parsedF = null;
      try { parsedF = JSON.parse(content.trim()); } catch (_) {
        const cleaned = content.replace(/```(?:json)?/g, '');
        const mF = cleaned.match(/\{[\s\S]*\}/);
        if (mF) { try { parsedF = JSON.parse(mF[0]); } catch (_) {} }
      }

      const callSig = parsedF && parsedF.function
        ? `${parsedF.function}(${JSON.stringify(parsedF.arguments ?? {})})` : '';

      // JSON lock-in: model replied with a JSON object that is NOT a usable
      // function call — either no "function" key or an empty function name
      // (e.g. {"function": "", "arguments": {}}). Nudge it to plain text.
      if (parsedF && typeof parsedF === 'object' && !Array.isArray(parsedF)
          && !(typeof parsedF.function === 'string' && parsedF.function.trim())
          && !featherlessNudged) {
        featherlessNudged = true;
        addSystemMsg('⚠ Model replied with a JSON object instead of plain text; asking it to answer normally.');
        history.push({ role: 'user', content: '(system) Your last reply was a raw JSON object. That is only allowed when CALLING a function. Answer the user in normal conversational plain text now — no JSON.' });
        continue;
      }

      if (parsedF && typeof parsedF.function === 'string' && parsedF.function && callSig === lastFeatherlessCall) {
        // Model repeated the exact same call — refuse it and demand a plain answer.
        addSystemMsg('⚠ Repeated identical function call blocked; asking the model to answer from the result.');
        history.push({ role: 'user', content: '(system) You already called that exact function and its result is in this conversation. Do NOT call it again. Answer the user\'s original question now in plain text — no JSON.' });
        lastFeatherlessCall = '';
        continue; // next round with the refusal in context
      }

      if (parsedF && typeof parsedF.function === 'string' && parsedF.function) {
        const fargs = (parsedF.arguments && typeof parsedF.arguments === 'object') ? parsedF.arguments : {};
        lastFeatherlessCall = callSig;
        pendingToolCalls = [{
          id: `call_${Math.random().toString(36).slice(2)}`,
          function: { name: parsedF.function, arguments: JSON.stringify(fargs) },
        }];
        finishReason = 'tool_calls';
      } else if (content) {
        bubble   = addBubble('assistant', '');
        fullText = content;
        bubble.innerHTML = renderMarkdown(fullText);
        scrollBottom();
      }
      // fullText is pushed to history by the shared "Normal text finish" below.
    } else {
    // Stream and collect chunks
    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        const t = line.trim();
        if (!t || t === 'data: [DONE]') continue;
        if (!t.startsWith('data: ')) continue;

        let json;
        try { json = JSON.parse(t.slice(6)); } catch { continue; }

        const choice = json.choices?.[0];
        if (!choice) continue;

        finishReason = choice.finish_reason || finishReason;
        const delta  = choice.delta || {};

        // Accumulate tool call deltas
        if (delta.tool_calls) {
          for (const tc of delta.tool_calls) {
            const idx = tc.index ?? 0;
            if (!pendingToolCalls[idx]) {
              pendingToolCalls[idx] = { id: '', function: { name: '', arguments: '' } };
            }
            if (tc.id)                pendingToolCalls[idx].id = tc.id;
            if (tc.function?.name)    pendingToolCalls[idx].function.name    += tc.function.name;
            if (tc.function?.arguments) pendingToolCalls[idx].function.arguments += tc.function.arguments;
          }
        }

        // Stream text content
        if (delta.content) {
                  fullText += delta.content;
                  if (!bubble) bubble = addBubble('assistant', '');
                  bubble.innerHTML = renderMarkdown(fullText);
                  scrollBottom();
                }

        if (json.usage) {
          totalTokens += json.usage.total_tokens || 0;
          chatDoc.statusBar.textContent = `tokens: ${totalTokens.toLocaleString()}`;
        }
      }
    }
    }

    // ── Handle tool calls ───────────────────────────
    if (pendingToolCalls.length && (finishReason === 'tool_calls' || pendingToolCalls.some(t => t.function.name))) {
      // Push assistant message with tool_calls
      assistantMsg.tool_calls = pendingToolCalls.map(tc => ({
        id: tc.id || `call_${Math.random().toString(36).slice(2)}`,
        type: 'function',
        function: { name: tc.function.name, arguments: tc.function.arguments },
      }));
      history.push(assistantMsg);

      for (const tc of assistantMsg.tool_calls) {
        const name = tc.function.name;
        let args = {};
        try { args = JSON.parse(tc.function.arguments); } catch {}

        // Confirmation for destructive ops (tools + destructive raw SQL)
        const isDestructive = DESTRUCTIVE_TOOLS.has(name)
          || (name === 'execute_sql' && isDestructiveSql(args.sql));
        if (isDestructive) {
          const confirmed = await confirmModal(
            `Destructive operation: <strong>${name}</strong><br>Args: ${escHtml(JSON.stringify(args))}`,
            'Run anyway'
          );
          if (!confirmed) {
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: 'User cancelled this operation.' });
            continue;
          }
          args.confirm = true; // required by the server guard
        }

        const badge = addToolCallBubble(name, args);

        // Built-in: file system tools
        if (name.startsWith('fs_')) {
          let toolResult;
          try {
            if (name === 'fs_list_files') {
              const url = '/api/files' + (args.folder ? `?folder=${encodeURIComponent(args.folder)}` : '');
              toolResult = await fetch(url).then(r => r.json());
            } else if (name === 'fs_read_file') {
              const list = await fetch('/api/files').then(r => r.json());
              const f = list.find(x => x.name === args.name && x.folder === (args.folder || '/'));
              if (!f) throw new Error(`File "${args.name}" not found`);
              toolResult = await fetch(`/api/files/${f.id}`).then(r => r.json());
            } else if (name === 'fs_batch_read_files') {
              const fileList = Array.isArray(args.files) ? args.files : [];
              if (!fileList.length) throw new Error('No files provided in batch read');
              const storeList = await fetch('/api/files').then(r => r.json());
              const results = [];
              for (const fItem of fileList) {
                const fname = fItem.name || fItem.filename;
                const ffolder = fItem.folder || '/';
                const match = storeList.find(x => x.name === fname && x.folder === ffolder);
                if (!match) {
                  results.push({ name: fname, folder: ffolder, error: 'File not found' });
                } else {
                  const full = await fetch(`/api/files/${match.id}`).then(r => r.json());
                  results.push({ name: fname, folder: ffolder, content: full.content, language: full.language });
                }
              }
              toolResult = { files: results, count: results.length };
            } else if (name === 'fs_write_file') {
              const saved = await fetch('/api/files', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: args.name, folder: args.folder || '/', content: args.content, language: args.language || 'plain' }),
              }).then(r => r.json());
              if (saved.error) throw new Error(saved.error);
              openEditorWindow({ filename: args.name, content: args.content, language: args.language, fileRef: { id: saved.id, name: saved.name, folder: saved.folder } });
              toolResult = { saved: true, id: saved.id, message: `"${args.name}" saved and opened in editor.` };
            } else if (name === 'fs_delete_file') {
              const list = await fetch('/api/files').then(r => r.json());
              const f = list.find(x => x.name === args.name && x.folder === (args.folder || '/'));
              if (!f) throw new Error(`File "${args.name}" not found`);
              await fetch(`/api/files/${f.id}`, { method: 'DELETE' });
              toolResult = { deleted: true, message: `"${args.name}" deleted.` };
            }
            badge.textContent = '✓ OK'; badge.className = 'tc-badge ok';
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: JSON.stringify(toolResult) });
          } catch (e) {
            badge.textContent = '✗ ERROR'; badge.className = 'tc-badge err'; badge.title = e.message;
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Error: ${e.message}` });
          }
          continue;
        }

        // Built-in: subagent
        if (name === 'run_subagent') {
          try {
            const taskStr = args.task || '';
            if (!taskStr) throw new Error('task is required');
            const key = chatDoc.apiKey.value.trim();
            const model = chatDoc.modelSel.value;
            const res = await fetch('/api/agent', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ task: taskStr, apiKey: key, model, baseUrl: normBaseUrl(getApiBaseUrl()) }),
            });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';
            let subagentSummary = '';
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop();
              for (const line of lines) {
                const t = line.trim();
                if (!t.startsWith('data:')) continue;
                let evt;
                try { evt = JSON.parse(t.slice(5).trim()); } catch { continue; }
                if (evt.type === 'done') subagentSummary = evt.summary || 'Task complete.';
                else if (evt.type === 'error') subagentSummary = `Subagent error: ${evt.message}`;
              }
            }
            badge.textContent = '✓ Subagent'; badge.className = 'tc-badge ok';
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: subagentSummary || 'Subagent executed.' });
          } catch (e) {
            badge.textContent = '✗ ERROR'; badge.className = 'tc-badge err'; badge.title = e.message;
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Error: ${e.message}` });
          }
          continue;
        }

        // Built-in: editor
        if (name === 'open_editor') {
          openEditorWindow({
            filename: args.filename || 'untitled.txt',
            content:  args.content  || '',
            language: args.language || '',
          });
          badge.textContent = '✓ Opened'; badge.className = 'tc-badge ok';
          history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Editor opened: "${args.filename || 'untitled.txt'}"` });
          continue;
        }

        // Built-in: generate_image — call the provider's image-generation endpoint
                if (name === 'generate_image') {
                  try {
                    const rr = await fetch('/api/generate-image', {
                      method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                                      prompt: args.prompt,
                                      apiKey: getImageApiKey() || key,
                                      baseUrl: normBaseUrl(getImageApiBaseUrl()),
                                      model: args.model || imageModel,
                                      size: args.size,
                                    }),
                    }).then(r => r.json()).catch(e => ({ error: e.message }));
                    if (rr.error) throw new Error(rr.error);
                    // Render the generated image in the chat.
                    addBubble('assistant', `<img class="chat-img" src="${rr.image}" alt="generated image" />`);
                    badge.textContent = '✓ Image'; badge.className = 'tc-badge ok';
                    history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: 'Generated image.' });
                  } catch (e) {
                    badge.textContent = '✗ ERROR'; badge.className = 'tc-badge err'; badge.title = e.message;
                    history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Error: ${e.message}` });
                  }
                  continue;
                }

                // Built-in: skill_read — load a skill's instructions + resources on demand
        if (name === 'skill_read') {
          try {
            const list = await fetch('/api/skills').then(r => r.json());
            const s = list.find(x => x.name === args.name);
            if (!s) throw new Error(`Skill "${args.name}" not found`);
            const full = await fetch(`/api/skills/${s.id}`).then(r => r.json());
            const resText = (full.resources || []).map(r =>
              `--- ${r.name} ---\n${r.content}`).join('\n\n');
            const content = `# Skill: ${full.name}\n\n## Description\n${full.description}\n\n## Instructions\n${full.instructions}\n\n${resText ? '## Resources\n' + resText : ''}`;
            badge.textContent = '✓ Loaded'; badge.className = 'tc-badge ok';
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content });
          } catch (e) {
            badge.textContent = '✗ ERROR'; badge.className = 'tc-badge err'; badge.title = e.message;
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Error: ${e.message}` });
          }
          continue;
        }

        // Built-in: create_custom_tool — save a custom tool to localStorage
        if (name === 'create_custom_tool') {
          try {
            const tname = String(args.name || '').trim();
            if (!/^[a-z][a-z0-9_]*$/.test(tname)) throw new Error('Name must be snake_case (a-z, 0-9, _).');
            if (!args.body) throw new Error('body is required.');
            const tool = {
              name: tname,
              description: String(args.description || ''),
              parameters: (args.parameters && typeof args.parameters === 'object') ? args.parameters : {},
              body: String(args.body),
              language: 'python',
            };
            const list = getCustomTools();
            const existing = list.findIndex(t => t.name === tname);
            if (existing >= 0) list[existing] = tool; else list.push(tool);
            saveCustomTools(list);
            badge.textContent = '✓ Saved'; badge.className = 'tc-badge ok';
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Custom tool "${tname}" created/updated. It is now available for the AI to call.` });
          } catch (e) {
            badge.textContent = '✗ ERROR'; badge.className = 'tc-badge err'; badge.title = e.message;
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Error: ${e.message}` });
          }
          continue;
        }

        // Built-in: create_skill — save a skill to the skills store
        if (name === 'create_skill') {
          try {
            const sname = String(args.name || '').trim();
            if (!/^[a-z][a-z0-9-]*$/.test(sname)) throw new Error('Name must be lowercase letters, numbers, hyphens.');
            if (!args.instructions) throw new Error('instructions is required.');
            const payload = {
              name: sname,
              description: String(args.description || ''),
              instructions: String(args.instructions),
              resources: Array.isArray(args.resources) ? args.resources : [],
            };
            const list = await fetch('/api/skills').then(r => r.json());
            const existing = list.find(s => s.name === sname);
            const res = existing
              ? await fetch(`/api/skills/${existing.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
              : await fetch('/api/skills', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
            await loadSkillsMeta();
            badge.textContent = '✓ Saved'; badge.className = 'tc-badge ok';
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Skill "${sname}" created/updated. It is now available and its metadata is in the system prompt.` });
          } catch (e) {
            badge.textContent = '✗ ERROR'; badge.className = 'tc-badge err'; badge.title = e.message;
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Error: ${e.message}` });
          }
          continue;
        }

        // Execute custom tools server-side (Python run(args) bodies)
        const customTool = getCustomTools().find(ct => ct.name === name);
        if (customTool) {
          try {
            const rr = await fetch('/api/run-tool', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, args }),
            }).then(r => r.json()).catch(e => ({ success: false, error: e.message }));
            if (!rr.success) throw new Error(rr.error || 'Tool failed');
            badge.textContent = '✓ OK'; badge.className = 'tc-badge ok';
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: JSON.stringify(rr.result) });
          } catch (e) {
            badge.textContent = '✗ ERROR'; badge.className = 'tc-badge err'; badge.title = e.message;
            history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: `Error: ${e.message}` });
          }
          continue;
        }

        const res = await fetch('/api/db', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: name, args }),
        }).then(r => r.json()).catch(e => ({ success: false, error: e.message }));

        badge.textContent = res.success ? '✓ OK' : '✗ ERROR';
        badge.className   = 'tc-badge ' + (res.success ? 'ok' : 'err');
        if (!res.success) badge.title = res.error;

        const resultStr = res.success
          ? JSON.stringify(res.result, null, 0)
          : `ERROR: ${res.error}`;
        history.push({ role: 'tool', __fnName: name, tool_call_id: tc.id, content: resultStr });
      }

      // Loop for next AI turn
      bubble = null; fullText = ''; pendingToolCalls = [];
      addTypingIndicator(); firstCall = false;
      continue;
    }

    // ── Normal text finish ───────────────────────────
    if (fullText) {
      history.push({ role: 'assistant', content: fullText });
    } else if (!pendingToolCalls.length) {
      addSystemMsg('*(empty response)*');
    }
    break;
  }
}

function handleCommand(text) {
  const parts = text.slice(1).trim().split(/\s+/);
  const cmd   = parts[0].toLowerCase();
  const arg   = parts.slice(1).join(' ').trim();

  switch (cmd) {
    case 'help':     return cmdHelp();
    case 'models':   return openModelPicker();
    case 'tables':   return cmdTables();
    case 'describe': return arg ? cmdDescribe(arg) : addSystemMsg('Usage: /describe &lt;table&gt;');
    case 'rows':     return cmdRows(parts[1], parseInt(parts[2]) || 50);
    case 'sql':      return arg ? cmdSqlRun(arg) : cmdSqlModal();
    case 'agent':    return arg ? cmdAgent(arg) : cmdAgentModal();
    case 'connect':  return cmdConnect();
    case 'settings': return cmdSettings();
    case 'skills':   return openSkillsModal();
    case 'characters': return openCharactersModal();
    case 'imagine':  return arg ? cmdImagine(arg) : addSystemMsg('Usage: /imagine &lt;prompt&gt;');
    case 'auto_imagine': return cmdAutoImagine();
    case 'tools':    return openToolsModal();
    case 'clear':    return cmdClear();
    default:         addSystemMsg(`Unknown command: <strong>/${cmd}</strong> — type /help for the list.`);
  }
}

  const rows = cols.map(c => `

async function cmdRows(table, limit = 50) {
  if (!table) return addSystemMsg('Usage: /rows &lt;table&gt; [limit]');

  const res = await dbCall('select_rows', { table_name: table, limit });
  if (!res.success) return addSystemMsg(`❌ ${escHtml(res.error)}`);
  const rows = res.result?.rows || [];
  if (!rows.length) return addSystemMsg(`Table <strong>${escHtml(table)}</strong> is empty.`);
  const cols = Object.keys(rows[0]);
  const hdr  = cols.map(c => `<th>${escHtml(c)}</th>`).join('');
  const body = rows.map(r =>
    `<tr>${cols.map(c => `<td>${escHtml(String(r[c] ?? ''))}</td>`).join('')}</tr>`
  ).join('');
  const count = res.result?.count ?? rows.length;
  openModal({
    id: `rows-${table}`, title: `📊 ${table} (${count} rows)`,
    width: '640px', height: '420px',
    content: `<div class="data-table-wrap"><table class="data-table">

}

async function cmdSqlRun(sql) {
  const destructive = isDestructiveSql(sql);
  if (destructive) {
    const confirmed = await confirmModal(
      `Destructive SQL:<br><code>${escHtml(sql)}</code>`,
      'Run anyway'
    );
    if (!confirmed) return addSystemMsg('SQL cancelled.');
  }
  addSystemMsg(`Running SQL…`);
  const res = await dbCall('execute_sql', { sql, confirm: destructive });
  if (!res.success) return addSystemMsg(`❌ SQL error: ${escHtml(res.error)}`);
  const { rows = [], rowCount = 0 } = res.result;
  if (!rows.length) return addSystemMsg(`✓ Query OK — ${rowCount} row(s) affected.`);
  const cols = Object.keys(rows[0]);
  const hdr  = cols.map(c => `<th>${escHtml(c)}</th>`).join('');
  const body = rows.map(r =>
    `<tr>${cols.map(c => `<td>${escHtml(String(r[c] ?? ''))}</td>`).join('')}</tr>`
  ).join('');
  openModal({
    id: `sql-result-${Date.now()}`, title: `🔍 Result (${rows.length} rows)`,
    width: '640px', height: '400px',
    content: `<div class="data-table-wrap"><table class="data-table">
      <thead><tr>${hdr}</tr></thead><tbody>${body}</tbody></table></div>`,
  });
}

async function cmdAgent(task) {
  const key   = chatDoc.apiKey.value.trim();
  const model = chatDoc.modelSel.value;
  if (!key) return addSystemMsg('⚠ Enter your OpenRouter API key first.');

  const { logEl, win } = openLogModal(`🤖 Agent: ${task.slice(0, 40)}${task.length > 40 ? '…' : ''}`);
  const append = (cls, text) => {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text + '\n';
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
  };

  append('', `Task: ${task}\n${'─'.repeat(50)}`);

  try {
    const response = await fetch('/api/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, apiKey: key, model, baseUrl: normBaseUrl(getApiBaseUrl()) }),
    });

    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        let evt;
        try { evt = JSON.parse(t.slice(5).trim()); } catch { continue; }

        if (evt.type === 'tool_call') {
          const argStr = JSON.stringify(evt.args || {}).slice(0, 80);
          append('log-tool', `  → ${evt.name}(${argStr}${argStr.length >= 80 ? '…' : ''})`);
        } else if (evt.type === 'tool_result') {
          const cls = evt.success ? 'log-ok' : 'log-err';
          append(cls, `     [${evt.success ? 'OK' : 'ERR'}] ${(evt.result || evt.error || '').slice(0, 200)}`);
        } else if (evt.type === 'done') {
          append('log-done', `\n✓ Done\n${evt.summary}`);
          addSystemMsg(`🤖 Agent finished: ${escHtml(evt.summary)}`);
        } else if (evt.type === 'error') {
          append('log-err', `\n✗ Error: ${evt.message}`);
          addSystemMsg(`❌ Agent error: ${escHtml(evt.message)}`);
        }
      }
    }
  } catch (e) {
    append('log-err', `\nFetch error: ${e.message}`);
  }
}

function applySettings() {
  const p = document.getElementById('s-provider')?.value;
  const k = document.getElementById('s-key')?.value.trim();
  const b = document.getElementById('s-base')?.value.trim();
  const m = document.getElementById('s-model')?.value;
  const im = document.getElementById('s-imgmodel')?.value.trim();
  const a = document.getElementById('s-auth')?.value.trim();
  const ip = document.getElementById('s-imgprovider')?.value;
  const ik = document.getElementById('s-imgkey')?.value.trim();
  const ib = document.getElementById('s-imgbase')?.value.trim();
  const du = document.getElementById('s-dburl')?.value.trim();
  if (ip) { imageProvider = ip; localStorage.setItem('winboxai_image_provider', ip); }
  if (ib !== undefined) { imageBaseUrl = ib; localStorage.setItem('winboxai_image_base_url', ib); }
  if (ik !== undefined) { imageApiKey = ik; localStorage.setItem('winboxai_image_api_key', ik); }
  if (p) { apiProvider = p; localStorage.setItem('winboxai_provider', p); }
  if (b !== undefined) { apiBaseUrl = b; localStorage.setItem('winboxai_base_url', b); }
  if (im) { imageModel = im; localStorage.setItem('winboxai_image_model', im); }
  if (k) chatDoc.apiKey.value = k;
  if (m) chatDoc.modelSel.value = m;
  if (a !== undefined) { authToken = a; localStorage.setItem('winboxai_auth_token', a); }
  // Push a new Postgres endpoint to the server (persisted in db_config.json).
  if (du !== undefined && du) {
    fetch('/api/db-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dbUrl: du }),
    }).then(r => r.json()).then(res => {
      if (!res.success) addSystemMsg(`✗ DB config: ${res.error}`);
      else if (res.warning) addSystemMsg(`⚠ DB URL saved, but connect failed: ${res.warning}`);
      else { addSystemMsg(`✓ Database connected: ${res.dbUrl}`); checkDbStatus(); }
    }).catch(e => addSystemMsg(`✗ DB config failed: ${e.message}`));
  }
  openModals.get('settings')?.close();
  addSystemMsg('✓ Settings saved.');
}

        prompt,
        apiKey: getImageApiKey() || key,
        baseUrl: normBaseUrl(getImageApiBaseUrl()),

// /auto_imagine — craft a reverse image prompt from the character + recent scene,
// then generate the image. Uses the chat model to write the prompt.
async function cmdAutoImagine() {
  const key = chatDoc.apiKey.value.trim();
  if (!key) return addSystemMsg('⚠ Enter your API key first — open ⚙ Settings.');
  if (!activeCharacter) return addSystemMsg('⚠ No active character. Use 🎭 Characters → USE IN CHAT first.');
  // Predict which image model will be used (server confirms in its response):
  // avatar + Venice → /image/edit (server-side IMAGE_EDIT_MODEL); otherwise imageModel.
  const useEdit = !!activeCharacter.avatar && /venice\.ai/i.test(normBaseUrl(getImageApiBaseUrl()));
  let predictedImgModel = imageModel;
  if (useEdit) {
    try {
      const cfg = await fetch('/api/image-config').then(r => r.json());
      predictedImgModel = cfg.imageEditModel;
    } catch {}
  }
  addSystemMsg(`🎨 Auto-imagining the current scene…<br><small>chat: ${escHtml(chatDoc.modelSel.value)} · image: ${escHtml(predictedImgModel)}${useEdit ? ' (avatar edit)' : ''}</small>`);
  try {
    const rr = await fetch('/api/auto-imagine', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        character: activeCharacter,
        recentMessages: history.slice(-8),
        apiKey: key,
        chatBaseUrl: normBaseUrl(getApiBaseUrl()),
        chatModel: chatDoc.modelSel.value,
        imageBaseUrl: normBaseUrl(getImageApiBaseUrl()),
        imageApiKey: getImageApiKey(),
        imageModel,
      }),
    }).then(r => r.json()).catch(e => ({ error: e.message }));
    if (rr.error) throw new Error(rr.error);
    addBubble('assistant', `<img class="chat-img" src="${rr.image}" alt="generated image" />`);
    // Keep the model-facing history clean: a short placeholder, not the huge base64 URL.
    history.push({ role: 'assistant', content: '[generated image]' });
    addSystemMsg(`🎨 Prompt used: <em>${escHtml(rr.prompt)}</em><br><small>models — chat: ${escHtml(rr.chatModel || '?')} · image: ${escHtml(rr.imageModel || '?')}</small>`);
  } catch (e) {
    addSystemMsg(`❌ Auto-imagine failed: ${escHtml(e.message)}`);
  }
}

/* ══════════════════════════════════════════════════════
   MODAL FACTORY
══════════════════════════════════════════════════════ */
function openModal({ id, title, width='480px', height='400px', content='', footer='' }) {
  if (openModals.has(id)) { openModals.get(id).focus(); return; }

  const root = document.createElement('div');
  root.className = 'modal-root';

  const body = document.createElement('div');
  body.className = 'modal-body';
  body.innerHTML = content;
  root.appendChild(body);

  if (footer) {
    const ft = document.createElement('div');
    ft.className = 'modal-footer';
    ft.innerHTML = footer;
    root.appendChild(ft);
  }

  const off = (modalOffset % 5) * 24;
  modalOffset++;
  const wb = new WinBox({
    title,
    width, height,
    x: `calc(50% - ${parseInt(width)/2 - off}px)`,
    y: `calc(50% - ${parseInt(height)/2 - off}px)`,
    background: '#4a4580',
    border: 2,
    mount: root,
    onclose() { openModals.delete(id); },
  });
  openModals.set(id, wb);
  return wb;
}
